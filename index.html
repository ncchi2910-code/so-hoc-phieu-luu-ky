<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Số Học Phiêu Lưu Ký — Cùng Kim</title>
<style>
  :root{
    --bg-1:#dbeafe;
    --bg-2:#e0f7fa;
    --bg-3:#f0fdf4;
    --ink:#1f2a44;
    --ink-2:#4b5b75;
    --muted:#8093ad;
    --line:#e3ecf7;
    --primary:#3b82f6;
    --primary-2:#2563eb;
    --pink:#ec4899;
    --pink-2:#db2777;
    --mint:#10b981;
    --mint-2:#059669;
    --sun:#f59e0b;
    --sun-2:#d97706;
    --coral:#fb7185;
    --violet:#8b5cf6;
    --card:#ffffff;
    --shadow-sm:0 2px 6px rgba(31,42,68,0.08);
    --shadow:0 8px 24px rgba(31,42,68,0.10);
    --shadow-lg:0 16px 40px rgba(31,42,68,0.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100vh;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Nunito","Quicksand",Arial,sans-serif;
    background:
      radial-gradient(900px 600px at 90% -10%, #fde2e8 0%, transparent 60%),
      radial-gradient(700px 500px at -10% 110%, #d6f3e3 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    background-attachment:fixed;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0;letter-spacing:-0.2px}
  .app{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:14px 14px 28px;min-height:100vh;display:flex;flex-direction:column}

  /* ====== Buttons ====== */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    font-family:inherit;font-weight:700;font-size:16px;
    padding:13px 22px;border:0;border-radius:999px;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#fff;cursor:pointer;
    box-shadow:0 6px 14px rgba(59,130,246,0.35);
    transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
  }
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:translateY(1px);box-shadow:0 3px 8px rgba(59,130,246,0.3)}
  .btn.pink{background:linear-gradient(135deg,var(--pink),var(--pink-2));box-shadow:0 6px 14px rgba(236,72,153,0.35)}
  .btn.mint{background:linear-gradient(135deg,var(--mint),var(--mint-2));box-shadow:0 6px 14px rgba(16,185,129,0.35)}
  .btn.sun{background:linear-gradient(135deg,var(--sun),var(--sun-2));box-shadow:0 6px 14px rgba(245,158,11,0.35);color:#3d2a05}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);border:1px solid var(--line)}
  .btn:disabled{opacity:0.5;cursor:not-allowed;filter:grayscale(0.4)}

  /* ====== Title screen ====== */
  .title-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 4px;text-align:center}
  .title-card{
    background:var(--card);
    border-radius:24px;padding:28px 22px;
    box-shadow:var(--shadow-lg);
    max-width:540px;width:100%;
    border:1px solid var(--line);
    position:relative;overflow:hidden;
  }
  .title-card::before{
    content:"";position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,#fde2e8,transparent);opacity:0.7;
  }
  .title-card::after{
    content:"";position:absolute;bottom:-60px;left:-60px;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,#d6f3e3,transparent);opacity:0.7;
  }
  .kim-avatar{
    width:96px;height:96px;border-radius:50%;
    background:linear-gradient(135deg,#fcd5ce,#ffd6a5);
    display:flex;align-items:center;justify-content:center;
    font-size:54px;margin:0 auto 14px;position:relative;z-index:1;
    box-shadow:0 8px 18px rgba(252,181,168,0.5);
    border:4px solid #fff;
  }
  .game-title{font-size:30px;font-weight:800;color:var(--ink);margin:8px 0 4px;position:relative;z-index:1;letter-spacing:-0.5px}
  .game-subtitle{color:var(--ink-2);font-size:14px;font-weight:500;margin:2px 0 18px;position:relative;z-index:1}
  .intro-text{
    text-align:left;font-size:15px;line-height:1.65;color:var(--ink-2);
    background:#f7fbff;border-radius:14px;padding:14px 16px;margin-bottom:18px;position:relative;z-index:1;
    border:1px dashed #c7d8ec;
  }
  .intro-text b{color:var(--primary-2)}

  /* ====== Map screen ====== */
  .map-screen{flex:1;display:flex;flex-direction:column}
  .map-header{text-align:center;margin:6px 0 14px;padding:0 6px}
  .map-header h2{font-size:24px;font-weight:800;color:var(--ink);display:flex;justify-content:center;gap:8px;align-items:center}
  .map-header .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .kim-bubble{
    display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    padding:6px 12px 6px 6px;border-radius:999px;box-shadow:var(--shadow-sm);font-size:13px;color:var(--ink-2);font-weight:600;margin-top:6px;
  }
  .kim-bubble .mini{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#fcd5ce,#ffd6a5);display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid #fff}

  .group-card{
    background:var(--card);border-radius:18px;
    padding:14px;margin-bottom:14px;box-shadow:var(--shadow);
    border:1px solid var(--line);
    position:relative;
  }
  .group-card.locked{opacity:0.85}
  .group-label{
    display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--ink);
    text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px;
  }
  .group-label .badge{
    font-size:11px;padding:3px 10px;border-radius:999px;color:#fff;background:linear-gradient(135deg,var(--mint),var(--mint-2));
    text-transform:none;letter-spacing:0;
  }
  .group-label .badge.locked{background:linear-gradient(135deg,#94a3b8,#64748b)}
  .group-label .hint{font-weight:500;color:var(--muted);font-size:12px;text-transform:none;letter-spacing:0;margin-left:auto}

  .stages-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr}
  @media (max-width:540px){.stages-grid{grid-template-columns:1fr 1fr}}
  @media (max-width:380px){.stages-grid{grid-template-columns:1fr}}
  .stage-tile{
    background:#f7fbff;border:2px solid var(--line);border-radius:16px;
    padding:12px 10px;cursor:pointer;text-align:center;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    position:relative;
  }
  .stage-tile.unlocked:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#cbd5e1}
  .stage-tile.locked{cursor:not-allowed;opacity:0.55;filter:grayscale(0.4)}
  .stage-tile.done{background:linear-gradient(180deg,#e0f7ec,#c8efd5);border-color:#86d3a8}
  .stage-tile .num{
    position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:50%;
    background:#fff;color:var(--ink-2);font-size:11px;font-weight:800;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line);
  }
  .stage-tile .ic{
    width:54px;height:54px;border-radius:18px;margin:8px auto 6px;
    display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    box-shadow:0 6px 12px rgba(59,130,246,0.35);
  }
  .stage-tile.c1 .ic{background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 6px 12px rgba(245,158,11,0.35)}
  .stage-tile.c2 .ic{background:linear-gradient(135deg,#34d399,#10b981);box-shadow:0 6px 12px rgba(16,185,129,0.35)}
  .stage-tile.c3 .ic{background:linear-gradient(135deg,#f472b6,#db2777);box-shadow:0 6px 12px rgba(236,72,153,0.35)}
  .stage-tile.c4 .ic{background:linear-gradient(135deg,#60a5fa,#2563eb);box-shadow:0 6px 12px rgba(59,130,246,0.35)}
  .stage-tile.c5 .ic{background:linear-gradient(135deg,#a78bfa,#7c3aed);box-shadow:0 6px 12px rgba(124,58,237,0.35)}
  .stage-tile.c6 .ic{background:linear-gradient(135deg,#fb7185,#e11d48);box-shadow:0 6px 12px rgba(225,29,72,0.35)}
  .stage-tile.locked .ic{background:linear-gradient(135deg,#94a3b8,#64748b);box-shadow:none}
  .stage-tile.done .ic::after{content:"✓";position:absolute;font-size:18px;background:var(--mint);width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;transform:translate(20px,-20px);border:2px solid #fff}
  .stage-tile .name{font-weight:700;font-size:13px;color:var(--ink);line-height:1.2;margin:0}
  .stage-tile .meta{font-size:11px;color:var(--muted);margin-top:3px}

  /* ====== Stage screen ====== */
  .stage-top{
    display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);
    padding:10px 14px;border-radius:14px;box-shadow:var(--shadow-sm);
    margin-bottom:10px;
  }
  .stage-top .mini-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#fcd5ce,#ffd6a5);display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #fff;box-shadow:var(--shadow-sm)}
  .stage-top .title{font-weight:800;font-size:15px;color:var(--ink);flex:1;line-height:1.2}
  .stage-top .meta{display:flex;gap:10px;font-size:12px;color:var(--ink-2);font-weight:600}
  .stage-top .meta b{color:var(--primary-2);font-weight:800}

  .progress-wrap{margin-bottom:10px}
  .progress-bar{
    height:10px;background:#e9eff7;border-radius:99px;overflow:hidden;border:1px solid var(--line);
  }
  .progress-bar-fill{
    height:100%;background:linear-gradient(90deg,#34d399,#3b82f6);
    transition:width .35s cubic-bezier(.5,.2,.2,1);border-radius:99px;
  }

  .question-card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;box-shadow:var(--shadow);
    flex:1;display:flex;flex-direction:column;
  }
  .q-tag{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;
    color:#fff;background:linear-gradient(135deg,var(--violet),#6d28d9);
    padding:4px 10px;border-radius:999px;align-self:flex-start;margin-bottom:10px;
  }
  .q-text{font-size:19px;line-height:1.55;color:var(--ink);font-weight:600;margin:4px 0 16px;min-height:54px}
  .q-text .scenario{display:block;font-size:14px;font-style:italic;color:var(--ink-2);font-weight:500;margin-bottom:6px}
  .frac{display:inline-block;vertical-align:middle;text-align:center;margin:0 3px;line-height:1}
  .frac .num{display:block;border-bottom:2.2px solid currentColor;padding:0 5px;font-size:0.88em}
  .frac .den{display:block;padding:0 5px;font-size:0.88em}

  .options{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  @media (max-width:440px){.options{grid-template-columns:1fr}}
  .opt-btn{
    font-family:inherit;font-size:17px;font-weight:700;
    padding:14px 12px;border:2px solid var(--line);border-radius:14px;
    background:#fff;color:var(--ink);cursor:pointer;
    transition:transform .08s ease, box-shadow .08s ease, border-color .08s ease, background .15s ease;
    min-height:56px;word-break:break-word;
  }
  .opt-btn:hover{border-color:#9ec0eb;background:#f7fbff}
  .opt-btn:active{transform:translateY(1px)}
  .opt-btn.correct{background:linear-gradient(135deg,#c6f6d5,#86efac);color:#14532d;border-color:#22c55e}
  .opt-btn.wrong{background:linear-gradient(135deg,#fed7d7,#fda4af);color:#7f1d1d;border-color:#f87171}
  .opt-btn.dim{opacity:0.5}
  .opt-btn:disabled{cursor:default}

  .stage-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap}
  .combo-badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;
    background:linear-gradient(135deg,#fed7aa,#fbbf24);color:#7c2d12;
    box-shadow:0 3px 8px rgba(251,191,36,0.35);
  }
  .combo-badge.zero{opacity:0.5;background:#e9eff7;color:var(--muted);box-shadow:none}

  /* ====== Modals (Explanation + Story + Reward) ====== */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:50;
    display:flex;align-items:center;justify-content:center;padding:18px;
    backdrop-filter:blur(3px);animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    background:var(--card);border-radius:22px;
    max-width:560px;width:100%;max-height:92vh;overflow-y:auto;
    padding:22px 20px;box-shadow:var(--shadow-lg);
    animation:popIn .28s cubic-bezier(.5,1.5,.5,1);
    position:relative;
  }
  @keyframes popIn{from{transform:scale(0.88);opacity:0}to{transform:scale(1);opacity:1}}

  /* Explanation modal */
  .explain-modal{border-top:6px solid var(--coral)}
  .explain-head{
    display:flex;align-items:center;gap:10px;margin-bottom:12px;
  }
  .explain-head .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#fcd5ce,#ffd6a5);display:flex;align-items:center;justify-content:center;font-size:24px;border:3px solid #fff;box-shadow:var(--shadow-sm)}
  .explain-head .h{flex:1}
  .explain-head .h .t{font-size:17px;font-weight:800;color:var(--ink)}
  .explain-head .h .s{font-size:13px;color:var(--ink-2)}
  .ex-block{
    background:#f7fbff;border-radius:14px;padding:12px 14px;margin:10px 0;
    border-left:4px solid var(--primary);
  }
  .ex-block .label{font-size:11px;font-weight:800;color:var(--primary-2);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .ex-block .content{font-size:15px;line-height:1.55;color:var(--ink)}
  .ex-block.steps{border-left-color:var(--violet);background:#f8f6ff}
  .ex-block.steps .label{color:#6d28d9}
  .ex-block.real{border-left-color:var(--mint);background:#f0fdf5}
  .ex-block.real .label{color:var(--mint-2)}
  .ex-block.real .content{font-style:italic}
  .ex-actions{display:flex;justify-content:center;margin-top:16px}

  /* Story modal */
  .story-modal{border-top:6px solid var(--violet)}
  .story-head{text-align:center;margin-bottom:10px}
  .story-icon{font-size:42px;color:var(--violet);margin:0 0 4px}
  .story-title{font-size:21px;font-weight:800;color:var(--ink);margin:2px 0}
  .story-sub{font-size:13px;color:var(--muted);font-style:italic}
  .story-body{font-size:15px;line-height:1.7;color:var(--ink);text-align:justify;margin-top:10px}
  .story-body p{margin:8px 0}
  .story-body b{color:var(--primary-2)}
  .story-quote{
    margin:14px 0 4px;padding:12px 14px;border-radius:12px;
    background:linear-gradient(135deg,#fff7ed,#fef3c7);
    border-left:4px solid var(--sun);color:#7c2d12;font-style:italic;font-weight:600;
  }
  .story-actions{display:flex;justify-content:center;margin-top:14px}

  /* Reward modal / screen */
  .reward-card{
    background:linear-gradient(180deg,#fff,#f7fbff);
    border-radius:22px;padding:18px;text-align:center;
    box-shadow:var(--shadow-lg);border:1px solid var(--line);
  }
  .reward-card .header{font-size:13px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px}
  .reward-card .header .star{color:var(--sun)}
  .reward-img-wrap{
    width:100%;max-width:420px;margin:6px auto 12px;border-radius:18px;overflow:hidden;
    background:linear-gradient(135deg,#fde7c4,#fcd5ce,#d6f3e3);
    aspect-ratio: 4/3;
    box-shadow:0 10px 24px rgba(0,0,0,0.1);
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .reward-img-wrap img{display:block;width:100%;height:100%;object-fit:cover}
  .reward-fallback{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:18px;color:var(--ink);text-align:center;width:100%;height:100%;
    background:linear-gradient(135deg,#fde7c4,#fcd5ce 50%,#d6f3e3);
  }
  .reward-fallback .big-icon{font-size:60px;margin-bottom:8px}
  .reward-fallback .ribbon{display:inline-block;background:#fff;color:var(--ink);padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;box-shadow:var(--shadow-sm)}
  .cheer-line{
    background:linear-gradient(135deg,#fff7ed,#ffedd5);
    border-radius:14px;padding:14px 16px;margin:10px 4px 4px;
    color:#7c2d12;font-size:15px;font-weight:700;line-height:1.5;
    border:1px dashed #fbbf24;
  }
  .cheer-line .label{display:block;font-size:11px;font-weight:800;color:var(--sun-2);letter-spacing:0.6px;margin-bottom:4px;text-transform:uppercase}

  /* Summary */
  .summary-card{
    background:var(--card);border-radius:22px;padding:22px 18px;text-align:center;
    box-shadow:var(--shadow-lg);border:1px solid var(--line);
  }
  .summary-card h2{font-size:24px;color:var(--ink);margin-bottom:6px}
  .summary-stars{font-size:32px;color:var(--sun);margin:10px 0;letter-spacing:6px;filter:drop-shadow(0 4px 8px rgba(245,158,11,0.4))}
  .summary-stat{font-size:15px;margin:5px 0;color:var(--ink-2)}
  .summary-stat b{color:var(--ink)}
  .summary-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}

  /* Final */
  .final-card{
    background:linear-gradient(135deg,#dbeafe,#f0fdf4,#fff7ed);
    border-radius:24px;padding:28px 20px;text-align:center;
    box-shadow:var(--shadow-lg);
  }
  .crown{font-size:64px;filter:drop-shadow(0 6px 12px rgba(245,158,11,0.5))}

  /* Confetti */
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
  .confetti i{
    position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;opacity:0.95;
    animation:fall 2.4s linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(720deg);opacity:0.4}
  }

  /* Tap feedback */
  .tap-pop{animation:tapPop .25s ease}
  @keyframes tapPop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}

  .footer-credit{text-align:center;font-size:11px;color:var(--muted);padding:10px 0 4px}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
"use strict";

/* ========================================================================
   PHẦN 1 — TIỆN ÍCH SỐ HỌC (GIỮ NGUYÊN — đã test ổn)
   ========================================================================*/

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b)}
function randInt(lo,hi){return Math.floor(Math.random()*(hi-lo+1))+lo}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

class Frac{
  constructor(n,d=1){
    if(d===0) throw new Error("Chia 0");
    if(!Number.isInteger(n)||!Number.isInteger(d)) throw new Error("Frac cần số nguyên: "+n+","+d);
    if(d<0){n=-n;d=-d}
    const g=gcd(n,d);
    this.n=n/g;
    this.d=d/g;
  }
  add(o){return new Frac(this.n*o.d + o.n*this.d, this.d*o.d)}
  sub(o){return new Frac(this.n*o.d - o.n*this.d, this.d*o.d)}
  mul(o){return new Frac(this.n*o.n, this.d*o.d)}
  div(o){if(o.n===0) throw new Error("div 0");return new Frac(this.n*o.d, this.d*o.n)}
  neg(){return new Frac(-this.n,this.d)}
  pow(k){let n=1,d=1;for(let i=0;i<k;i++){n*=this.n;d*=this.d}return new Frac(n,d)}
  eq(o){return this.n===o.n && this.d===o.d}
  isInt(){return this.d===1}
  toNum(){return this.n/this.d}
  toHTML(){
    if(this.d===1) return this.n<0 ? "(−"+Math.abs(this.n)+")" : ""+this.n;
    const sign = this.n<0 ? "−" : "";
    return '<span class="frac"><span class="num">'+sign+Math.abs(this.n)+'</span><span class="den">'+this.d+'</span></span>';
  }
  toHTMLraw(){
    if(this.d===1) return this.n<0 ? "−"+Math.abs(this.n) : ""+this.n;
    const sign = this.n<0 ? "−" : "";
    return '<span class="frac"><span class="num">'+sign+Math.abs(this.n)+'</span><span class="den">'+this.d+'</span></span>';
  }
  toLabel(){
    if(this.d===1) return this.n<0 ? "−"+Math.abs(this.n) : ""+this.n;
    const sign = this.n<0 ? "−" : "";
    return sign + Math.abs(this.n) + "/" + this.d;
  }
}
function F(n,d){return new Frac(n,d||1)}

function isFiniteDecimal(frac){
  let d=frac.d;
  while(d%2===0) d/=2;
  while(d%5===0) d/=5;
  return d===1;
}
function fmtNum(x, nDec){
  if(nDec===undefined) nDec=4;
  let s = x.toFixed(nDec);
  if(s.indexOf(".")>=0) s = s.replace(/0+$/,"").replace(/\.$/,"");
  return s.replace("-","−").replace(".",",");
}
function intHTML(n){return n<0 ? "−"+Math.abs(n) : ""+n}

/* ====== Tạo lựa chọn (đã test) ====== */
function makeOptionsFrac(correct, distractors){
  const seen = new Set();
  const opts = [];
  function add(f){
    const k = f.toLabel();
    if(seen.has(k)) return;
    seen.add(k); opts.push(f);
  }
  add(correct);
  for(const f of distractors){ if(opts.length>=4) break; add(f); }
  let guard=0;
  while(opts.length<4 && guard<30){
    guard++;
    const dn = correct.n + randInt(-5,5)*(randInt(1,3));
    const dd = correct.d + randInt(0,2);
    try{ const f=new Frac(dn || 1, Math.max(1,dd)); add(f);}catch(e){}
  }
  const shuffled = shuffle(opts);
  const idx = shuffled.findIndex(o=>o.eq(correct));
  return { options: shuffled.map(o=>o.toLabel()), answerIdx: idx };
}

function makeOptionsStr(correctLabel, distractorLabels){
  const seen=new Set([correctLabel]);
  const opts=[correctLabel];
  for(const d of distractorLabels){if(opts.length>=4) break; if(d!=null && !seen.has(d)){seen.add(d);opts.push(d)}}
  if(opts.length<4){
    const m = correctLabel.replace("−","-").replace(",",".");
    const v = parseFloat(m);
    if(Number.isFinite(v)){
      const fmts = [v+1, v-1, v+2, v-2, v*2, Math.round(v/2)];
      for(const cand of fmts){
        if(opts.length>=4) break;
        const s = (cand<0?"−"+Math.abs(cand):""+cand);
        if(!seen.has(s)){ seen.add(s); opts.push(s); }
      }
    }
  }
  let pad = 1;
  while(opts.length<4){
    const s = "≈" + pad;
    if(!seen.has(s)){ seen.add(s); opts.push(s); }
    pad++;
  }
  const shuffled = shuffle(opts);
  return { options: shuffled, answerIdx: shuffled.indexOf(correctLabel) };
}

// Mô tả "đời thường" cho số nguyên (nợ/có/tiền)
function realIntAdd(a,b){
  // Hình dung qua tiền/nợ
  if(a>=0 && b>=0) return "Kim có "+a+" nghìn, được mẹ cho thêm "+b+" nghìn → tổng "+(a+b)+" nghìn.";
  if(a<0 && b<0) return "Kim đang nợ "+Math.abs(a)+" nghìn, nợ thêm "+Math.abs(b)+" nghìn nữa → tổng nợ "+(Math.abs(a)+Math.abs(b))+" nghìn (tức "+(a+b)+").";
  if(a<0 && b>0){
    if(a+b>=0) return "Kim đang nợ "+Math.abs(a)+" nghìn, được cho "+b+" nghìn. Trả nợ xong còn "+(a+b)+" nghìn.";
    return "Kim đang nợ "+Math.abs(a)+" nghìn, được cho "+b+" nghìn. Trả bớt vẫn còn nợ "+Math.abs(a+b)+" nghìn (tức "+(a+b)+").";
  }
  // a>=0, b<0
  if(a+b>=0) return "Kim có "+a+" nghìn, tiêu "+Math.abs(b)+" nghìn → còn "+(a+b)+" nghìn.";
  return "Kim có "+a+" nghìn, nhưng cần tiêu "+Math.abs(b)+" nghìn → bị thiếu, thành nợ "+Math.abs(a+b)+" nghìn (tức "+(a+b)+").";
}
function realIntSub(a,b){
  // a − b = a + (−b)
  return "Phép trừ "+intHTML(a)+" − "+intHTML(b)+" có thể đổi thành "+intHTML(a)+" + "+intHTML(-b)+". " + realIntAdd(a, -b);
}
function realMul(a,b){
  if(a>0 && b>0) return "Hình dung "+a+" hộp bút, mỗi hộp "+b+" cây → tổng "+(a*b)+" cây bút.";
  if(a<0 && b<0) return "Hai số âm nhân nhau ra số dương: như khi 'nhân đôi khoản nợ ngược lại' → trở thành dư. Kết quả "+(a*b)+".";
  if(a<0 || b<0){
    const pos = a<0 ? b : a;
    const neg = a<0 ? a : b;
    return "Nhân số dương "+pos+" với số âm "+intHTML(neg)+" → kết quả âm. Hình dung "+pos+" tháng mỗi tháng tiêu hết "+Math.abs(neg)+" nghìn (số tiền giảm), tổng giảm "+(pos*Math.abs(neg))+" nghìn (tức "+(a*b)+").";
  }
  return "Kết quả "+(a*b)+".";
}
function realDiv(a,b){
  if(a>0 && b>0) return "Chia "+a+" viên kẹo cho "+b+" bạn, mỗi bạn được "+(a/b)+" viên.";
  return "Quy tắc dấu khi chia giống nhân: cùng dấu → dương, khác dấu → âm. Kết quả "+(a/b)+".";
}

function genQ_fracBasicPos(){
  // Phép tính 4 phép tính phân số DƯƠNG đơn giản (lớp 6)
  const op = pick(["+","−","×","÷"]);
  function pos(){
    const d = pick([2,3,4,5,6,8]);
    let n = randInt(1, d);
    return F(n,d);
  }
  let a = pos(), b = pos();
  // đảm bảo a−b ≥ 0 cho phép trừ
  if(op==="−" && a.toNum() < b.toNum()){ const t=a; a=b; b=t; }
  let ans;
  if(op==="+") ans = a.add(b);
  else if(op==="−") ans = a.sub(b);
  else if(op==="×") ans = a.mul(b);
  else ans = a.div(b);
  const distractors = [];
  try{ if(op==="+") distractors.push(new Frac(a.n+b.n, a.d+b.d)); }catch(e){}
  try{ distractors.push(a.add(b)); }catch(e){}
  try{ distractors.push(a.mul(b)); }catch(e){}
  if(b.n!==0) try{ distractors.push(a.div(b)); }catch(e){}
  distractors.push(F(ans.n+1, ans.d || 1));
  const mo = makeOptionsFrac(ans, shuffle(distractors.filter(d=>!d.eq(ans))));
  // Build steps depending on op
  let steps, realWorld;
  if(op==="+" || op==="−"){
    const L = lcm(a.d, b.d);
    const an = a.n*(L/a.d), bn = b.n*(L/b.d);
    const rn = op==="+" ? an+bn : an-bn;
    steps = [
      "Quy đồng mẫu: mẫu chung là "+L+". "+a.toLabel()+" = "+an+"/"+L+"; "+b.toLabel()+" = "+bn+"/"+L+".",
      (op==="+"?"Cộng tử với tử: ":"Trừ tử cho tử: ")+an+(op==="+"?"+":"−")+bn+" = "+rn+", giữ mẫu "+L+".",
      "Rút gọn (nếu được): "+rn+"/"+L+" = "+ans.toLabel()+"."
    ];
    realWorld = op==="+"
      ? realFracAdd(a.n,a.d,b.n,b.d, ans.n, ans.d)
      : realFracSub(a.n,a.d,b.n,b.d, ans.n, ans.d);
  } else if(op==="×"){
    steps = [
      "Nhân hai phân số: nhân tử với tử, mẫu với mẫu.",
      a.toLabel()+" × "+b.toLabel()+" = ("+a.n+"×"+b.n+")/("+a.d+"×"+b.d+") = "+(a.n*b.n)+"/"+(a.d*b.d)+".",
      "Rút gọn về "+ans.toLabel()+"."
    ];
    realWorld = realFracMul(a.n,a.d,b.n,b.d, ans.n, ans.d);
  } else {
    steps = [
      "Chia hai phân số: lật ngược phân số sau rồi nhân.",
      a.toLabel()+" ÷ "+b.toLabel()+" = "+a.toLabel()+" × "+b.d+"/"+b.n+" = "+(a.n*b.d)+"/"+(a.d*b.n)+".",
      "Rút gọn về "+ans.toLabel()+"."
    ];
    realWorld = realFracDiv();
  }
  return {
    qHTML: "Tính: "+a.toHTML()+" "+op+" "+b.toHTML()+" = ?",
    options: mo.options, answerIdx: mo.answerIdx, tag:"Phân số lớp 6",
    explain: { correctHTML: a.toLabel()+" "+op+" "+b.toLabel()+" = <b>"+ans.toLabel()+"</b>", steps, realWorld }
  };
}

// Chặng 4: Cộng/Trừ/Nhân/Chia số hữu tỉ
function genQ_ratArith(){
  const op = pick(["+","−","×","÷"]);
  function smallFrac(allowInt){
    const useInt = allowInt && Math.random()<0.35;
    if(useInt) return F(randInt(-9,9) || 2);
    let d = pick([2,3,4,5,6,8,10]);
    let n = randInt(-9,9); if(n===0) n=1;
    return F(n,d);
  }
  let a = smallFrac(true), b = smallFrac(true);
  if(op==="÷" && b.n===0) b = F(1,2);
  let ans;
  if(op==="+") ans = a.add(b);
  else if(op==="−") ans = a.sub(b);
  else if(op==="×") ans = a.mul(b);
  else ans = a.div(b);
  const distractors=[];
  try{ if(op==="+") distractors.push(new Frac(a.n+b.n, a.d+b.d)); }catch(e){}
  try{ distractors.push(a.add(b)); }catch(e){}
  try{ distractors.push(a.sub(b)); }catch(e){}
  try{ distractors.push(a.mul(b)); }catch(e){}
  if(b.n!==0) try{ distractors.push(a.div(b)); }catch(e){}
  try{ distractors.push(ans.neg()); }catch(e){}
  const mo = makeOptionsFrac(ans, shuffle(distractors.filter(d=>!d.eq(ans))));
  let steps, realWorld;
  if(op==="+" || op==="−"){
    const L = lcm(a.d, b.d);
    const an = a.n*(L/a.d), bn = b.n*(L/b.d);
    const rn = op==="+" ? an+bn : an-bn;
    steps = [
      "Quy đồng mẫu: mẫu chung "+L+". "+a.toLabel()+" = "+an+"/"+L+"; "+b.toLabel()+" = "+bn+"/"+L+".",
      (op==="+"?"Cộng tử với tử (giữ dấu): ":"Trừ tử cho tử (giữ dấu): ")+an+(op==="+"?" + ":" − ")+"("+bn+") = "+rn+".",
      "Kết quả: "+rn+"/"+L+" = "+ans.toLabel()+"."
    ];
    realWorld = "Kim cộng/trừ phân số có cả số âm cứ làm như cộng/trừ trên trục số: số âm tức là 'thiếu/nợ'.";
  } else if(op==="×"){
    steps = [
      "Nhân tử với tử, mẫu với mẫu, để ý dấu (cùng dấu → dương, khác dấu → âm).",
      a.toLabel()+" × "+b.toLabel()+" = ("+a.n+"×"+b.n+")/("+a.d+"×"+b.d+") = "+(a.n*b.n)+"/"+(a.d*b.d)+" = "+ans.toLabel()+"."
    ];
    realWorld = "Quy tắc dấu giống nhân số nguyên: âm × âm = dương, âm × dương = âm.";
  } else {
    steps = [
      "Chia hai phân số: lật ngược phân số sau rồi nhân, dấu áp dụng quy tắc nhân.",
      a.toLabel()+" ÷ "+b.toLabel()+" = "+a.toLabel()+" × "+(b.n<0?"−":"")+b.d+"/"+Math.abs(b.n)+" → kết quả "+ans.toLabel()+"."
    ];
    realWorld = "Như chia bánh phần âm: cứ tính trị tuyệt đối trước, dấu xử lý sau theo quy tắc dấu.";
  }
  return {
    qHTML: "Tính: "+a.toHTML()+" "+op+" "+b.toHTML()+" = ?",
    options: mo.options, answerIdx: mo.answerIdx, tag:"Số hữu tỉ",
    explain: { correctHTML: a.toLabel()+" "+op+" "+b.toLabel()+" = <b>"+ans.toLabel()+"</b>", steps, realWorld }
  };
}

// Chặng 5: Lũy thừa số hữu tỉ
function genQ_ratPower(){
  const variant = pick([1,2,3]);
  let qHTML, ans, base, exp, expr;
  if(variant===1){
    const d = pick([2,3,4,5]);
    let n = pick([1,2,3,-1,-2,-3]); if(n===0) n=1;
    base = F(n,d); exp = pick([2,3]);
    ans = base.pow(exp);
    qHTML = "Tính "+base.toHTML()+"<sup>"+exp+"</sup> = ?";
    expr = base.toLabel()+"^"+exp;
  } else if(variant===2){
    const a = randInt(2,7); exp = pick([2,3]);
    base = F(-a);
    ans = base.pow(exp);
    qHTML = "Tính (−"+a+")<sup>"+exp+"</sup> = ?";
    expr = "(−"+a+")^"+exp;
  } else {
    const a = randInt(2,5);
    let m = randInt(2,4), n = randInt(1,3);
    const isMul = Math.random()<0.5;
    if(isMul){
      ans = F(Math.pow(a,m+n));
      qHTML = a+"<sup>"+m+"</sup> × "+a+"<sup>"+n+"</sup> = ?";
      expr = a+"^"+m+" × "+a+"^"+n;
      var stepExtra = ["Cùng cơ số khi nhân: GIỮ cơ số, CỘNG số mũ. "+a+"^"+m+" × "+a+"^"+n+" = "+a+"^("+m+"+"+n+") = "+a+"^"+(m+n)+" = "+ans.toLabel()+"."];
    } else {
      if(m<n){const t=m; m=n; n=t}
      ans = F(Math.pow(a, m-n));
      qHTML = a+"<sup>"+m+"</sup> ÷ "+a+"<sup>"+n+"</sup> = ?";
      expr = a+"^"+m+" ÷ "+a+"^"+n;
      var stepExtra = ["Cùng cơ số khi chia: GIỮ cơ số, TRỪ số mũ. "+a+"^"+m+" ÷ "+a+"^"+n+" = "+a+"^("+m+"−"+n+") = "+a+"^"+(m-n)+" = "+ans.toLabel()+"."];
    }
  }
  const distractors = [];
  distractors.push(ans.neg());
  try{distractors.push(new Frac(ans.n*2, ans.d))}catch(e){}
  try{distractors.push(new Frac(ans.n, Math.max(1,ans.d*ans.d)))}catch(e){}
  const mo = makeOptionsFrac(ans, shuffle(distractors.filter(x=>!x.eq(ans))));
  let steps;
  if(variant===1){
    steps = [
      "Lũy thừa "+base.toLabel()+"^"+exp+" nghĩa là nhân "+base.toLabel()+" với chính nó "+exp+" lần.",
      "= ("+base.n+")^"+exp+" / ("+base.d+")^"+exp+" = "+Math.pow(base.n,exp)+"/"+Math.pow(base.d,exp)+" = "+ans.toLabel()+".",
      "Lưu ý dấu: số âm mũ chẵn → dương; mũ lẻ → âm."
    ];
  } else if(variant===2){
    steps = [
      "(−"+Math.abs(base.n)+")^"+exp+" = (−"+Math.abs(base.n)+") nhân với chính nó "+exp+" lần.",
      "Mũ "+(exp%2===0?"chẵn → kết quả DƯƠNG":"lẻ → kết quả ÂM")+".",
      "Trị tuyệt đối: "+Math.abs(base.n)+"^"+exp+" = "+Math.pow(Math.abs(base.n),exp)+", có dấu là "+ans.toLabel()+"."
    ];
  } else {
    steps = stepExtra;
  }
  return {
    qHTML, options: mo.options, answerIdx: mo.answerIdx, tag:"Lũy thừa",
    explain: {
      correctHTML: expr+" = <b>"+ans.toLabel()+"</b>",
      steps,
      realWorld: "Hình dung lũy thừa như 'nhân đôi/nhân ba lặp lại': 2^3 = 2×2×2 = 8, giống một tế bào chia ba lần thành 8 tế bào."
    }
  };
}

// Chặng 5: Thứ tự phép tính (mức lớp 7 — có ngoặc + phép tính kết hợp)
function genQ_ratOrder(){
  const variant = pick([1,2,3,4]);
  let expr, ans, stepLine;
  if(variant===1){
    const a=randInt(-9,9), b=randInt(2,9), c=randInt(2,9);
    ans = F(a + b*c);
    expr = intHTML(a) + " + " + b + " × " + c;
    stepLine = "Nhân trước: "+b+"×"+c+" = "+(b*c)+". Rồi "+intHTML(a)+" + "+(b*c)+" = "+intHTML(a+b*c)+".";
  } else if(variant===2){
    const a=randInt(-9,9), b=randInt(-9,9), c=randInt(2,9);
    ans = F((a+b)*c);
    expr = "(" + intHTML(a) + " + " + intHTML(b) + ") × " + c;
    stepLine = "Trong ngoặc trước: "+intHTML(a)+"+"+intHTML(b)+" = "+intHTML(a+b)+". Rồi nhân "+c+" được "+intHTML((a+b)*c)+".";
  } else if(variant===3){
    const a=randInt(-9,9), b=randInt(2,9), c=randInt(2,9), d=randInt(-9,9);
    ans = F(a - b*c + d);
    expr = intHTML(a) + " − " + b + " × " + c + " + " + intHTML(d);
    stepLine = "Nhân trước "+b+"×"+c+" = "+(b*c)+". Rồi tính trái sang phải: "+intHTML(a)+"−"+(b*c)+"+"+intHTML(d)+" = "+intHTML(a-b*c+d)+".";
  } else {
    const a=randInt(2,12), b=randInt(2,12), c=randInt(-5,5), d=randInt(-5,5);
    ans = F((a-b)*(c+d));
    expr = "(" + a + " − " + b + ") × (" + intHTML(c) + " + " + intHTML(d) + ")";
    stepLine = "Tính trong ngoặc trước: ("+a+"−"+b+") = "+intHTML(a-b)+"; ("+intHTML(c)+"+"+intHTML(d)+") = "+intHTML(c+d)+". Rồi nhân được "+intHTML((a-b)*(c+d))+".";
  }
  const distractors=[];
  distractors.push(F(ans.n + randInt(1,5)));
  distractors.push(F(ans.n - randInt(1,5)));
  distractors.push(ans.neg());
  const mo = makeOptionsFrac(ans, distractors);
  return {
    qHTML: "Tính giá trị: <b>"+expr+"</b> = ?",
    options: mo.options, answerIdx: mo.answerIdx, tag:"Thứ tự phép tính",
    explain: {
      correctHTML: expr+" = <b>"+ans.toLabel()+"</b>",
      steps: ["Nguyên tắc: ngoặc → nhân/chia → cộng/trừ; cùng cấp thì làm trái sang phải.", stepLine],
      realWorld: "Như đi mua hàng: tính (giá × số lượng) trước, rồi mới cộng/trừ vào tổng."
    }
  };
}

// Chặng 6: Biểu diễn thập phân
function genQ_ratDecimal(){
  const variant = pick([1,2]);
  let frac;
  if(variant===1){
    const denoms = [2,4,5,8,10,16,20,25,40,50];
    const d = pick(denoms);
    let n = randInt(1, d-1);
    while(gcd(n,d)===d) n = randInt(1,d-1);
    frac = F(n,d);
  } else {
    const denoms = [3,6,7,9,11,12,15,18,21];
    const d = pick(denoms);
    let n = randInt(1, d-1);
    while(gcd(n,d)===d) n = randInt(1,d-1);
    frac = F(n,d);
  }
  const finite = isFiniteDecimal(frac);
  const correct = finite ? "Số thập phân hữu hạn" : "Số thập phân vô hạn tuần hoàn";
  const wrong = finite ? "Số thập phân vô hạn tuần hoàn" : "Số thập phân hữu hạn";
  const opts = shuffle([correct, wrong, "Số vô tỉ", "Không xác định"]);
  // Mô tả lý do
  let dCheck = frac.d;
  let factors = "";
  let dd = frac.d;
  const primes = [];
  let p = 2;
  while(dd>1){
    while(dd%p===0){primes.push(p); dd/=p}
    p++;
    if(p>dd) {if(dd>1){primes.push(dd); dd=1}}
  }
  factors = primes.join(" × ");
  return {
    qHTML: "Phân số "+frac.toHTML()+" viết được dưới dạng nào?",
    options: opts, answerIdx: opts.indexOf(correct),
    tag:"Biểu diễn thập phân",
    explain: {
      correctHTML: frac.toLabel()+" → <b>"+correct+"</b>",
      steps: [
        "Quy tắc: phân số tối giản chỉ cho thập phân HỮU HẠN nếu mẫu CHỈ CHỨA ước 2 và/hoặc 5.",
        "Mẫu "+frac.d+" = "+factors+" → "+(finite?"chỉ có 2 và 5 → hữu hạn":"có ước khác 2 và 5 → vô hạn tuần hoàn"),
        finite ? "Ví dụ: "+frac.toLabel()+" = "+fmtNum(frac.n/frac.d,4)+"." : "Ví dụ: 1/3 = 0,333... lặp mãi không hết."
      ],
      realWorld: finite
        ? "Như chia "+frac.n+" ổ bánh cho "+frac.d+" bạn: chia đến số chữ số thập phân nào đó là dừng, không lẻ tiếp."
        : "Như chia 1 quả táo cho 3 bạn theo cân điện tử: mãi không ra số chẵn — phần lẻ cứ lặp lại."
    }
  };
}

   ========================================================================*/
function selfTest(){
  console.assert(F(2,4).eq(F(1,2)), "rút gọn");
  console.assert(F(1,2).add(F(1,3)).eq(F(5,6)), "1/2+1/3");
  console.assert(F(-3,4).mul(F(2,5)).eq(F(-3,10)), "(-3/4)*2/5");
  console.assert(F(-1,2).div(F(3,4)).eq(F(-2,3)), "(-1/2)/(3/4)");
  console.assert(F(-2,3).pow(3).eq(F(-8,27)), "(-2/3)^3");
  console.assert(isFiniteDecimal(F(1,2))===true, "1/2 hữu hạn");
  console.assert(isFiniteDecimal(F(1,3))===false, "1/3 vô hạn");
  console.assert(lcm(4,6)===12, "lcm(4,6)");
  const gens = [
    genQ_mulTable, genQ_divTable, genQ_quickAddSub,
    genQ_intArith, genQ_parens, genQ_intOrder,
    genQ_simplifyFrac, genQ_commonDen, genQ_fracBasicPos, genQ_fracDecimal,
    genQ_ratArith, genQ_ratPower, genQ_ratOrder, genQ_ratDecimal
  ];
  let pass=0, fail=0;
  for(const g of gens){
    for(let i=0;i<150;i++){
      try{
        const q = g();
        if(!q || !q.options || q.options.length<2) throw new Error("opts");
        if(q.answerIdx<0 || q.answerIdx>=q.options.length) throw new Error("idx");
        if(!q.qHTML) throw new Error("noQ");
        if(!q.explain || !q.explain.steps || !q.explain.realWorld) throw new Error("noExplain");
        const set = new Set(q.options);
        if(set.size !== q.options.length) throw new Error("dup");
        pass++;
      } catch(e){
        fail++;
        if(fail<5) console.warn("test fail", g.name, e.message);
      }
    }
  }
  console.log("Self-test: pass="+pass+", fail="+fail);
  return fail===0;
}

}

function stageTile(s, idx){
  const done = state.completed[idx];
  const unlocked = isUnlocked(idx);
  const cls = done ? "done" : unlocked ? "unlocked" : "locked";
  const t = el(`
    <div class="stage-tile ${cls} ${s.color}">
      <div class="num">${s.id}</div>

      <p class="meta">${done?"Đã qua ✓":(unlocked?(s.totalN+" câu · qua "+s.passN+"/"+s.totalN):"Khoá")}</p>
    </div>
  `);
  if(unlocked) t.onclick = ()=>startStage(idx);
  return t;
}

function startStage(i){
  state.stageIdx = i;
  state.questions = STAGES[i].build();
  state.qIdx = 0;
  state.correctCount = 0;
  state.combo = 0;
  state.bestCombo = 0;
  state.score = 0;
  state.locked = false;
  state.screen = "stage";
  render();
}

function renderStage(){
  const s = STAGES[state.stageIdx];
  const q = state.questions[state.qIdx];
  const pct = Math.round((state.qIdx / s.totalN) * 100);
  const v = el(`
    <div>
      <div class="stage-top">
        <span class="mini-av">🧒</span>
        <div class="title">Chặng ${s.id} · ${s.name}</div>
        <div class="meta">
          <span>Câu <b>${state.qIdx+1}</b>/${s.totalN}</span>
          <span>Đúng <b>${state.correctCount}</b></span>
          <span>Điểm <b>${state.score}</b></span>
        </div>
      </div>
      <div class="progress-wrap"><div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div></div>
      <div class="question-card">
        <span class="q-tag">${q.tag}</span>
        <div class="q-text">${q.qHTML}</div>
        <div class="options" id="opts"></div>
        <div class="stage-bottom">
          <span class="combo-badge ${state.combo>=2?"":"zero"}">🔥 Combo ×${state.combo}</span>
          <button class="btn ghost" id="btn-back">← Bản đồ</button>
        </div>
      </div>
    </div>
  `);
  app.appendChild(v);
  const opts = document.getElementById("opts");
  q.options.forEach((label, idx)=>{
    const b = document.createElement("button");
    b.className = "opt-btn";
    b.innerHTML = renderOptionLabel(label);
    b.onclick = ()=>answer(idx);
    opts.appendChild(b);
  });
  document.getElementById("btn-back").onclick = ()=>{
    if(state.locked) return;
    if(confirm("Kim muốn về bản đồ? Tiến trình chặng này sẽ mất.")){
      state.screen = "map"; render();
    }
  };
}

function renderOptionLabel(label){
  if(/[a-zA-ZÀ-ỹ]/.test(label)) return label;
  if(label.indexOf("/")>=0){
    let neg=false, body=label;
    if(body[0]==="−"||body[0]==="-"){neg=true; body=body.slice(1)}
    const [n,d] = body.split("/");
    return (neg?"−":"") + '<span class="frac"><span class="num">'+n+'</span><span class="den">'+d+'</span></span>';
  }
  if(label[0]==="-") return "−"+label.slice(1);
  return label;
}

function answer(idx){
  if(state.locked) return;
  state.locked = true;
  const q = state.questions[state.qIdx];
  const optsEl = document.getElementById("opts");
  Array.from(optsEl.children).forEach((btn, i)=>{
    btn.disabled = true;
    if(i === q.answerIdx) btn.classList.add("correct");
    else if(i === idx) btn.classList.add("wrong");
    else btn.classList.add("dim");
  });
  const correct = idx === q.answerIdx;
  if(correct){
    state.correctCount++;
    state.combo++;
    if(state.combo > state.bestCombo) state.bestCombo = state.combo;
    const bonus = Math.max(0, state.combo-1)*3;
    state.score += 10 + bonus;
    // Nhỏ flash, không cần modal
    setTimeout(()=>{
      state.locked = false;
      state.qIdx++;
      if(state.qIdx >= STAGES[state.stageIdx].totalN) finishStage();
      else render();
    }, 800);
  } else {
    state.combo = 0;
    // BẮT đọc giải thích
    showExplainModal(q, idx);
  }
}

      <div class="modal explain-modal">

          <div class="h">

        <div class="ex-block">
          <div class="label">🎯 Đáp án đúng</div>
          <div class="content">${exp.correctHTML || ("Đúng là <b>"+renderOptionLabel(correctLabel)+"</b>")}.
          <br><span style="color:var(--ink-2);font-size:13px">(Kim chọn: <b>${renderOptionLabel(chosenLabel)}</b> — chưa đúng.)</span></div>
        </div>

        <div class="ex-block steps">
          <div class="label">📝 Cách làm từng bước</div>
          <div class="content">${stepsHTML || "<div>• Làm theo công thức của dạng bài này.</div>"}</div>
        </div>

        <div class="ex-block real">
          <div class="label">💡 Ví dụ đời thường</div>
          <div class="content">${exp.realWorld || "Cứ bình tĩnh, làm lại sẽ ra."}</div>
        </div>

        <div class="ex-actions">
          <button class="btn mint" id="btn-understood">Đã hiểu — đi tiếp 👍</button>
        </div>
      </div>
    </div>
  `);
  app.appendChild(modal);
  document.getElementById("btn-understood").onclick = ()=>{
    modal.remove();
    state.locked = false;
    state.qIdx++;
    if(state.qIdx >= STAGES[state.stageIdx].totalN) finishStage();
    else render();
  };
}

function finishStage(){
  const s = STAGES[state.stageIdx];
  const pass = state.correctCount >= s.passN;
  if(pass){
    state.completed[state.stageIdx] = true;
    if(pass) fireConfetti();
  }
  state.screen = "summary";
  render();
}

function renderSummary(){
  const s = STAGES[state.stageIdx];
  const pass = state.correctCount >= s.passN;
  const stars = pass ? (state.correctCount===s.totalN ? "★★★" : state.correctCount>=9 ? "★★☆" : "★☆☆") : "☆☆☆";
  const v = el(`
    <div>
      <div class="map-header">
        <h2>${pass ? "🎉 Kim vượt chặng "+s.id+"!" : "💪 Kim thử lại chặng "+s.id+" nhé!"}</h2>
      </div>
      <div class="summary-card">
        <div class="summary-stars">${stars}</div>
        <div class="summary-stat">Đúng: <b>${state.correctCount}/${s.totalN}</b> · Combo cao nhất: <b>×${state.bestCombo}</b></div>
        <div class="summary-stat">Điểm chặng: <b>${state.score}</b></div>
        <div class="summary-stat" style="margin-top:12px">
          ${pass ? "Kim đã vượt chặng <b>"+s.name+"</b>. Một câu chuyện lịch sử & phần thưởng đang chờ!" : "Cần đúng ít nhất <b>"+s.passN+"/"+s.totalN+"</b>. Chơi lại nhé — đề sẽ đổi mới hoàn toàn."}
        </div>
        <div class="summary-actions">
          ${pass ? '<button class="btn pink" id="btn-story">📜 Đọc câu chuyện + nhận thưởng</button>' : '<button class="btn" id="btn-retry">↻ Thử lại</button>'}
          <button class="btn ghost" id="btn-map">← Về bản đồ</button>
        </div>
      </div>
    </div>
  `);
  app.appendChild(v);
  if(pass){
    document.getElementById("btn-story").onclick = ()=>{
      state.storyIdx = state.stageIdx;
      state.screen = "story"; render();
    };
  } else {
    document.getElementById("btn-retry").onclick = ()=>startStage(state.stageIdx);
  }
  document.getElementById("btn-map").onclick = ()=>{state.screen="map"; render()};
}

function renderStory(){
  // bản đồ ngầm làm nền
  renderMap();
  const story = STORIES[state.storyIdx];
  const modal = el(`
    <div class="modal-backdrop">
      <div class="modal story-modal">
        <div class="story-head">
          <div class="story-icon">${story.icon}</div>
          <h2 class="story-title">${story.title}</h2>
          <div class="story-sub">${story.sub}</div>
        </div>
        <div class="story-body">${story.body}</div>
        <div class="story-quote">"${story.quote}"</div>
        <div class="story-actions">
          <button class="btn" id="btn-reward">Nhận phần thưởng 🎁</button>
        </div>
      </div>
    </div>
  `);
  app.appendChild(modal);
  document.getElementById("btn-reward").onclick = ()=>{
    state.screen = "reward"; render();
  };
}

function renderReward(){
  renderMap();
  const n = state.storyIdx + 1;
  const cheer = CHEERS[state.storyIdx];
  const imgPath = "images/chuyen"+n+".jpg";
  const fallbackBig = ["🏺","🧧","📜","✨","🕌","⛵"][state.storyIdx];
  const modal = el(`
    <div class="modal-backdrop">
      <div class="modal" style="border-top:6px solid var(--sun)">
        <div class="reward-card">
          <div class="header">🎁 Phần thưởng chặng ${n} <span class="star">★</span></div>
          <div class="reward-img-wrap" id="img-wrap">
            <img src="${imgPath}" alt="Phần thưởng chặng ${n}" onerror="this.style.display='none'; document.getElementById('fb-${n}').style.display='flex';"/>
            <div class="reward-fallback" id="fb-${n}" style="display:none">
              <div class="big-icon">${fallbackBig}</div>
              <div class="ribbon">Phần thưởng chặng ${n}</div>
              <div style="margin-top:8px;font-size:13px;color:var(--ink-2)">Hình kỷ niệm chưa cài, nhưng phần thưởng vẫn đây!</div>
            </div>
          </div>
          <div class="cheer-line">
            <span class="label">📣 Gai Con cổ vũ</span>
            ${cheer}
          </div>
          <div style="margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <button class="btn mint" id="btn-next">${state.storyIdx===STAGES.length-1 && state.completed.every(x=>x)?"👑 Xem màn hoàn thành":"Tiếp tục phiêu lưu →"}</button>
            <button class="btn ghost" id="btn-map">Về bản đồ</button>
          </div>
        </div>
      </div>
    </div>
  `);
  app.appendChild(modal);
  document.getElementById("btn-next").onclick = ()=>{
    if(state.storyIdx===STAGES.length-1 && state.completed.every(x=>x)){
      state.screen = "final";
    } else {
      state.screen = "map";
    }
    render();
  };
  document.getElementById("btn-map").onclick = ()=>{state.screen="map"; render()};
}

function renderFinal(){
  fireConfetti();
  const v = el(`
    <div class="title-screen">
      <div class="final-card">
        <div class="crown">👑</div>
        <h2 style="font-size:28px;margin:8px 0">Hoàn thành xuất sắc, Kim!</h2>
        <p style="color:var(--ink-2);font-style:italic;margin:6px 0 14px">Kim đã đi qua cả 6 chặng và mở khoá cả 6 câu chuyện lịch sử + phần thưởng.</p>
        <div style="font-size:15px;line-height:1.7;text-align:left;background:#fff;padding:14px 16px;border-radius:14px;box-shadow:var(--shadow-sm);border:1px solid var(--line)">
          <b style="color:var(--primary-2)">Nhóm A — ôn nền lớp 6:</b><br>
          ✖️ Bảng cửu chương · ➕ Số nguyên · 🍰 Phân số & thập phân<br><br>
          <b style="color:var(--pink-2)">Nhóm B — Toán 7 Chương I:</b><br>
          ⚙️ 4 phép tính số hữu tỉ · ⚡ Lũy thừa & thứ tự · 🔢 Biểu diễn thập phân<br><br>
          <span style="color:var(--mint-2);font-weight:700">Kim đã vững nền tảng để bước vào Chương II Số thực — chuyện đó để bản sau nhé.</span>
        </div>
        <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn pink" id="btn-replay">↻ Chơi lại từ đầu</button>
          <button class="btn ghost" id="btn-map">← Bản đồ</button>
        </div>
      </div>
    </div>
  `);
  app.appendChild(v);
  document.getElementById("btn-replay").onclick = ()=>{
    state.completed = [false,false,false,false,false,false];
    state.screen = "map"; render();
  };
  document.getElementById("btn-map").onclick = ()=>{state.screen="map"; render()};
}

/* ====== Confetti nhỏ ====== */
function fireConfetti(){
  const colors = ["#3b82f6","#ec4899","#10b981","#f59e0b","#8b5cf6","#fb7185"];
  const layer = document.createElement("div");
  layer.className = "confetti";
  for(let i=0;i<60;i++){
    const c = document.createElement("i");
    c.style.left = (Math.random()*100)+"%";
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay = (Math.random()*0.6)+"s";
    c.style.animationDuration = (1.8 + Math.random()*1.5)+"s";
    c.style.transform = "rotate("+Math.floor(Math.random()*360)+"deg)";
    layer.appendChild(c);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 3200);
}

/* ====== INIT ====== */
window.addEventListener("DOMContentLoaded", ()=>{
  const ok = selfTest();
  if(!ok) console.warn("Self-test có lỗi — kiểm tra console");
  render();
});
</script>
</body>
