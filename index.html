<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Số Học Phiêu Lưu Ký — Cùng Kim</title>
<style>
  :root{
    --bg-1:#dbeafe;
    --bg-2:#e0f7fa;
    --bg-3:#f0fdf4;
    --ink:#1f2a44;
    --ink-2:#4b5b75;
    --muted:#8093ad;
    --line:#e3ecf7;
    --primary:#3b82f6;
    --primary-2:#2563eb;
    --pink:#ec4899;
    --pink-2:#db2777;
    --mint:#10b981;
    --mint-2:#059669;
    --sun:#f59e0b;
    --sun-2:#d97706;
    --coral:#fb7185;
    --violet:#8b5cf6;
    --card:#ffffff;
    --shadow-sm:0 2px 6px rgba(31,42,68,0.08);
    --shadow:0 8px 24px rgba(31,42,68,0.10);
    --shadow-lg:0 16px 40px rgba(31,42,68,0.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100vh;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Nunito","Quicksand",Arial,sans-serif;
    background:
      radial-gradient(900px 600px at 90% -10%, #fde2e8 0%, transparent 60%),
      radial-gradient(700px 500px at -10% 110%, #d6f3e3 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    background-attachment:fixed;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0;letter-spacing:-0.2px}
  .app{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:14px 14px 28px;min-height:100vh;display:flex;flex-direction:column}

  /* ====== Buttons ====== */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    font-family:inherit;font-weight:700;font-size:16px;
    padding:13px 22px;border:0;border-radius:999px;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#fff;cursor:pointer;
    box-shadow:0 6px 14px rgba(59,130,246,0.35);
    transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
  }
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:translateY(1px);box-shadow:0 3px 8px rgba(59,130,246,0.3)}
  .btn.pink{background:linear-gradient(135deg,var(--pink),var(--pink-2));box-shadow:0 6px 14px rgba(236,72,153,0.35)}
  .btn.mint{background:linear-gradient(135deg,var(--mint),var(--mint-2));box-shadow:0 6px 14px rgba(16,185,129,0.35)}
  .btn.sun{background:linear-gradient(135deg,var(--sun),var(--sun-2));box-shadow:0 6px 14px rgba(245,158,11,0.35);color:#3d2a05}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);border:1px solid var(--line)}
  .btn:disabled{opacity:0.5;cursor:not-allowed;filter:grayscale(0.4)}

  /* ====== Title screen ====== */
  .title-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 4px;text-align:center}
  .title-card{
    background:var(--card);
    border-radius:24px;padding:28px 22px;
    box-shadow:var(--shadow-lg);
    max-width:540px;width:100%;
    border:1px solid var(--line);
    position:relative;overflow:hidden;
  }
  .title-card::before{
    content:"";position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,#fde2e8,transparent);opacity:0.7;
  }
  .title-card::after{
    content:"";position:absolute;bottom:-60px;left:-60px;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,#d6f3e3,transparent);opacity:0.7;
  }
  .kim-avatar{
    width:96px;height:96px;border-radius:50%;
    background:linear-gradient(135deg,#fcd5ce,#ffd6a5);
    display:flex;align-items:center;justify-content:center;
    font-size:54px;margin:0 auto 14px;position:relative;z-index:1;
    box-shadow:0 8px 18px rgba(252,181,168,0.5);
    border:4px solid #fff;
  }
  .game-title{font-size:30px;font-weight:800;color:var(--ink);margin:8px 0 4px;position:relative;z-index:1;letter-spacing:-0.5px}
  .game-subtitle{color:var(--ink-2);font-size:14px;font-weight:500;margin:2px 0 18px;position:relative;z-index:1}
  .intro-text{
    text-align:left;font-size:15px;line-height:1.65;color:var(--ink-2);
    background:#f7fbff;border-radius:14px;padding:14px 16px;margin-bottom:18px;position:relative;z-index:1;
    border:1px dashed #c7d8ec;
  }
  .intro-text b{color:var(--primary-2)}

  /* ====== Map screen ====== */
  .map-screen{flex:1;display:flex;flex-direction:column}
  .map-header{text-align:center;margin:6px 0 14px;padding:0 6px}
  .map-header h2{font-size:24px;font-weight:800;color:var(--ink);display:flex;justify-content:center;gap:8px;align-items:center}
  .map-header .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .kim-bubble{
    display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    padding:6px 12px 6px 6px;border-radius:999px;box-shadow:var(--shadow-sm);font-size:13px;color:var(--ink-2);font-weight:600;margin-top:6px;
  }
  .kim-bubble .mini{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#fcd5ce,#ffd6a5);display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid #fff}

  .group-card{
    background:var(--card);border-radius:18px;
    padding:14px;margin-bottom:14px;box-shadow:var(--shadow);
    border:1px solid var(--line);
    position:relative;
  }
  .group-card.locked{opacity:0.85}
  .group-label{
    display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--ink);
    text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px;
  }
  .group-label .badge{
    font-size:11px;padding:3px 10px;border-radius:999px;color:#fff;background:linear-gradient(135deg,var(--mint),var(--mint-2));
    text-transform:none;letter-spacing:0;
  }
  .group-label .badge.locked{background:linear-gradient(135deg,#94a3b8,#64748b)}
  .group-label .hint{font-weight:500;color:var(--muted);font-size:12px;text-transform:none;letter-spacing:0;margin-left:auto}

  .stages-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr}
  @media (max-width:540px){.stages-grid{grid-template-columns:1fr 1fr}}
  @media (max-width:380px){.stages-grid{grid-template-columns:1fr}}
  .stage-tile{
    background:#f7fbff;border:2px solid var(--line);border-radius:16px;
    padding:12px 10px;cursor:pointer;text-align:center;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    position:relative;
  }
  .stage-tile.unlocked:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#cbd5e1}
  .stage-tile.locked{cursor:not-allowed;opacity:0.55;filter:grayscale(0.4)}
  .stage-tile.done{background:linear-gradient(180deg,#e0f7ec,#c8efd5);border-color:#86d3a8}
  .stage-tile .num{
    position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:50%;
    background:#fff;color:var(--ink-2);font-size:11px;font-weight:800;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line);
  }
  .stage-tile .ic{
    width:54px;height:54px;border-radius:18px;margin:8px auto 6px;
    display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    box-shadow:0 6px 12px rgba(59,130,246,0.35);
  }
  .stage-tile.c1 .ic{background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 6px 12px rgba(245,158,11,0.35)}
  .stage-tile.c2 .ic{background:linear-gradient(135deg,#34d399,#10b981);box-shadow:0 6px 12px rgba(16,185,129,0.35)}
  .stage-tile.c3 .ic{background:linear-gradient(135deg,#f472b6,#db2777);box-shadow:0 6px 12px rgba(236,72,153,0.35)}
  .stage-tile.c4 .ic{background:linear-gradient(135deg,#60a5fa,#2563eb);box-shadow:0 6px 12px rgba(59,130,246,0.35)}
  .stage-tile.c5 .ic{background:linear-gradient(135deg,#a78bfa,#7c3aed);box-shadow:0 6px 12px rgba(124,58,237,0.35)}
  .stage-tile.c6 .ic{background:linear-gradient(135deg,#fb7185,#e11d48);box-shadow:0 6px 12px rgba(225,29,72,0.35)}
  .stage-tile.locked .ic{background:linear-gradient(135deg,#94a3b8,#64748b);box-shadow:none}
  .stage-tile.done .ic::after{content:"✓";position:absolute;font-size:18px;background:var(--mint);width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;transform:translate(20px,-20px);border:2px solid #fff}
  .stage-tile .name{font-weight:700;font-size:13px;color:var(--ink);line-height:1.2;margin:0}
  .stage-tile .meta{font-size:11px;color:var(--muted);margin-top:3px}

  /* ====== Stage screen ====== */
  .stage-top{
    display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);
    padding:10px 14px;border-radius:14px;box-shadow:var(--shadow-sm);
    margin-bottom:10px;
  }
  .stage-top .mini-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#fcd5ce,#ffd6a5);display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #fff;box-shadow:var(--shadow-sm)}
  .stage-top .title{font-weight:800;font-size:15px;color:var(--ink);flex:1;line-height:1.2}
  .stage-top .meta{display:flex;gap:10px;font-size:12px;color:var(--ink-2);font-weight:600}
  .stage-top .meta b{color:var(--primary-2);font-weight:800}

  .progress-wrap{margin-bottom:10px}
  .progress-bar{
    height:10px;background:#e9eff7;border-radius:99px;overflow:hidden;border:1px solid var(--line);
  }
  .progress-bar-fill{
    height:100%;background:linear-gradient(90deg,#34d399,#3b82f6);
    transition:width .35s cubic-bezier(.5,.2,.2,1);border-radius:99px;
  }

  .question-card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;box-shadow:var(--shadow);
    flex:1;display:flex;flex-direction:column;
  }
  .q-tag{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;
    color:#fff;background:linear-gradient(135deg,var(--violet),#6d28d9);
    padding:4px 10px;border-radius:999px;align-self:flex-start;margin-bottom:10px;
  }
  .q-text{font-size:19px;line-height:1.55;color:var(--ink);font-weight:600;margin:4px 0 16px;min-height:54px}
  .q-text .scenario{display:block;font-size:14px;font-style:italic;color:var(--ink-2);font-weight:500;margin-bottom:6px}
  .frac{display:inline-block;vertical-align:middle;text-align:center;margin:0 3px;line-height:1}
  .frac .num{display:block;border-bottom:2.2px solid currentColor;padding:0 5px;font-size:0.88em}
  .frac .den{display:block;padding:0 5px;font-size:0.88em}

  .options{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  @media (max-width:440px){.options{grid-template-columns:1fr}}
  .opt-btn{
    font-family:inherit;font-size:17px;font-weight:700;
    padding:14px 12px;border:2px solid var(--line);border-radius:14px;
    background:#fff;color:var(--ink);cursor:pointer;
    transition:transform .08s ease, box-shadow .08s ease, border-color .08s ease, background .15s ease;
    min-height:56px;word-break:break-word;
  }
  .opt-btn:hover{border-color:#9ec0eb;background:#f7fbff}
  .opt-btn:active{transform:translateY(1px)}
  .opt-btn.correct{background:linear-gradient(135deg,#c6f6d5,#86efac);color:#14532d;border-color:#22c55e}
  .opt-btn.wrong{background:linear-gradient(135deg,#fed7d7,#fda4af);color:#7f1d1d;border-color:#f87171}
  .opt-btn.dim{opacity:0.5}
  .opt-btn:disabled{cursor:default}

  .stage-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap}
  .combo-badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;
    background:linear-gradient(135deg,#fed7aa,#fbbf24);color:#7c2d12;
    box-shadow:0 3px 8px rgba(251,191,36,0.35);
  }
  .combo-badge.zero{opacity:0.5;background:#e9eff7;color:var(--muted);box-shadow:none}

  /* ====== Modals (Explanation + Story + Reward) ====== */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:50;
    display:flex;align-items:center;justify-content:center;padding:18px;
    backdrop-filter:blur(3px);animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    background:var(--card);border-radius:22px;
    max-width:560px;width:100%;max-height:92vh;overflow-y:auto;
    padding:22px 20px;box-shadow:var(--shadow-lg);
    animation:popIn .28s cubic-bezier(.5,1.5,.5,1);
    position:relative;
  }
  @keyframes popIn{from{transform:scale(0.88);opacity:0}to{transform:scale(1);opacity:1}}

  /* Explanation modal */
  .explain-modal{border-top:6px solid var(--coral)}
  .explain-head{
    display:flex;align-items:center;gap:10px;margin-bottom:12px;
  }
  .explain-head .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#fcd5ce,#ffd6a5);display:flex;align-items:center;justify-content:center;font-size:24px;border:3px solid #fff;box-shadow:var(--shadow-sm)}
  .explain-head .h{flex:1}
  .explain-head .h .t{font-size:17px;font-weight:800;color:var(--ink)}
  .explain-head .h .s{font-size:13px;color:var(--ink-2)}
  .ex-block{
    background:#f7fbff;border-radius:14px;padding:12px 14px;margin:10px 0;
    border-left:4px solid var(--primary);
  }
  .ex-block .label{font-size:11px;font-weight:800;color:var(--primary-2);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .ex-block .content{font-size:15px;line-height:1.55;color:var(--ink)}
  .ex-block.steps{border-left-color:var(--violet);background:#f8f6ff}
  .ex-block.steps .label{color:#6d28d9}
  .ex-block.real{border-left-color:var(--mint);background:#f0fdf5}
  .ex-block.real .label{color:var(--mint-2)}
  .ex-block.real .content{font-style:italic}
  .ex-actions{display:flex;justify-content:center;margin-top:16px}

  /* Story modal */
  .story-modal{border-top:6px solid var(--violet)}
  .story-head{text-align:center;margin-bottom:10px}
  .story-icon{font-size:42px;color:var(--violet);margin:0 0 4px}
  .story-title{font-size:21px;font-weight:800;color:var(--ink);margin:2px 0}
  .story-sub{font-size:13px;color:var(--muted);font-style:italic}
  .story-body{font-size:15px;line-height:1.7;color:var(--ink);text-align:justify;margin-top:10px}
  .story-body p{margin:8px 0}
  .story-body b{color:var(--primary-2)}
  .story-quote{
    margin:14px 0 4px;padding:12px 14px;border-radius:12px;
    background:linear-gradient(135deg,#fff7ed,#fef3c7);
    border-left:4px solid var(--sun);color:#7c2d12;font-style:italic;font-weight:600;
  }
  .story-actions{display:flex;justify-content:center;margin-top:14px}

  /* Reward modal / screen */
  .reward-card{
    background:linear-gradient(180deg,#fff,#f7fbff);
    border-radius:22px;padding:18px;text-align:center;
    box-shadow:var(--shadow-lg);border:1px solid var(--line);
  }
  .reward-card .header{font-size:13px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px}
  .reward-card .header .star{color:var(--sun)}
  .reward-img-wrap{
    width:100%;max-width:420px;margin:6px auto 12px;border-radius:18px;overflow:hidden;
    background:linear-gradient(135deg,#fde7c4,#fcd5ce,#d6f3e3);
    aspect-ratio: 4/3;
    box-shadow:0 10px 24px rgba(0,0,0,0.1);
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .reward-img-wrap img{display:block;width:100%;height:100%;object-fit:cover}
  .reward-fallback{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:18px;color:var(--ink);text-align:center;width:100%;height:100%;
    background:linear-gradient(135deg,#fde7c4,#fcd5ce 50%,#d6f3e3);
  }
  .reward-fallback .big-icon{font-size:60px;margin-bottom:8px}
  .reward-fallback .ribbon{display:inline-block;background:#fff;color:var(--ink);padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;box-shadow:var(--shadow-sm)}
  .cheer-line{
    background:linear-gradient(135deg,#fff7ed,#ffedd5);
    border-radius:14px;padding:14px 16px;margin:10px 4px 4px;
    color:#7c2d12;font-size:15px;font-weight:700;line-height:1.5;
    border:1px dashed #fbbf24;
  }
  .cheer-line .label{display:block;font-size:11px;font-weight:800;color:var(--sun-2);letter-spacing:0.6px;margin-bottom:4px;text-transform:uppercase}

  /* Summary */
  .summary-card{
    background:var(--card);border-radius:22px;padding:22px 18px;text-align:center;
    box-shadow:var(--shadow-lg);border:1px solid var(--line);
  }
  .summary-card h2{font-size:24px;color:var(--ink);margin-bottom:6px}
  .summary-stars{font-size:32px;color:var(--sun);margin:10px 0;letter-spacing:6px;filter:drop-shadow(0 4px 8px rgba(245,158,11,0.4))}
  .summary-stat{font-size:15px;margin:5px 0;color:var(--ink-2)}
  .summary-stat b{color:var(--ink)}
  .summary-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}

  /* Final */
  .final-card{
    background:linear-gradient(135deg,#dbeafe,#f0fdf4,#fff7ed);
    border-radius:24px;padding:28px 20px;text-align:center;
    box-shadow:var(--shadow-lg);
  }
  .crown{font-size:64px;filter:drop-shadow(0 6px 12px rgba(245,158,11,0.5))}

  /* Confetti */
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
  .confetti i{
    position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;opacity:0.95;
    animation:fall 2.4s linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(720deg);opacity:0.4}
  }

  /* Tap feedback */
  .tap-pop{animation:tapPop .25s ease}
  @keyframes tapPop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}

  .footer-credit{text-align:center;font-size:11px;color:var(--muted);padding:10px 0 4px}

  /* ====== v3: Thẻ động viên random ====== */
  .cheer-modal{border-top:6px solid var(--coral)}
  .cheer-img-wrap{
    width:100%;max-width:380px;margin:6px auto 12px;border-radius:18px;overflow:hidden;
    background:linear-gradient(135deg,#fde7c4,#fcd5ce,#d6f3e3);
    aspect-ratio: 4/3;box-shadow:0 10px 24px rgba(0,0,0,0.10);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .cheer-img-wrap img{display:block;width:100%;height:100%;object-fit:cover}
  .cheer-img-wrap .fb{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:100%;height:100%;padding:18px;text-align:center;
    background:linear-gradient(135deg,#fde7c4,#fcd5ce 50%,#d6f3e3);
  }
  .cheer-img-wrap .fb .big{font-size:60px;margin-bottom:8px}
  .cheer-img-wrap .fb .rib{display:inline-block;background:#fff;color:var(--ink);padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;box-shadow:var(--shadow-sm)}
  .cheer-text{
    background:linear-gradient(135deg,#fff7ed,#ffedd5);
    border-radius:14px;padding:14px 16px;margin:8px 4px 4px;
    color:#7c2d12;font-size:15px;font-weight:700;line-height:1.5;
    border:1px dashed #fbbf24;
  }
  .cheer-text .label{display:block;font-size:11px;font-weight:800;color:var(--sun-2);letter-spacing:0.6px;margin-bottom:4px;text-transform:uppercase}

  /* ====== v3: Thẻ cào ====== */
  .scratch-modal{border-top:6px solid var(--sun)}
  .scratch-stage{
    position:relative;width:100%;max-width:380px;margin:6px auto 8px;
    border-radius:18px;overflow:hidden;box-shadow:0 12px 26px rgba(0,0,0,0.14);
    background:#fff;border:1px solid var(--line);
    aspect-ratio: 16/10;
  }
  .scratch-prize{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:linear-gradient(135deg,#fff7ed,#fde68a,#fcd5ce);
    color:#7c2d12;text-align:center;padding:14px;
  }

<body>
<div class="app" id="app"></div>

<script>
"use strict";

/* ========================================================================
   PHẦN 1 — TIỆN ÍCH SỐ HỌC (GIỮ NGUYÊN — đã test ổn)
   ========================================================================*/

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b)}
function randInt(lo,hi){return Math.floor(Math.random()*(hi-lo+1))+lo}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

class Frac{
  constructor(n,d=1){
    if(d===0) throw new Error("Chia 0");
    if(!Number.isInteger(n)||!Number.isInteger(d)) throw new Error("Frac cần số nguyên: "+n+","+d);
    if(d<0){n=-n;d=-d}
    const g=gcd(n,d);
    this.n=n/g;
    this.d=d/g;
  }
  add(o){return new Frac(this.n*o.d + o.n*this.d, this.d*o.d)}
  sub(o){return new Frac(this.n*o.d - o.n*this.d, this.d*o.d)}
  mul(o){return new Frac(this.n*o.n, this.d*o.d)}
  div(o){if(o.n===0) throw new Error("div 0");return new Frac(this.n*o.d, this.d*o.n)}
  neg(){return new Frac(-this.n,this.d)}
  pow(k){let n=1,d=1;for(let i=0;i<k;i++){n*=this.n;d*=this.d}return new Frac(n,d)}
  eq(o){return this.n===o.n && this.d===o.d}
  isInt(){return this.d===1}
  toNum(){return this.n/this.d}
  toHTML(){
    if(this.d===1) return this.n<0 ? "(−"+Math.abs(this.n)+")" : ""+this.n;
    const sign = this.n<0 ? "−" : "";
    return '<span class="frac"><span class="num">'+sign+Math.abs(this.n)+'</span><span class="den">'+this.d+'</span></span>';
  }
  toHTMLraw(){
    if(this.d===1) return this.n<0 ? "−"+Math.abs(this.n) : ""+this.n;
    const sign = this.n<0 ? "−" : "";
    return '<span class="frac"><span class="num">'+sign+Math.abs(this.n)+'</span><span class="den">'+this.d+'</span></span>';
  }
  toLabel(){
    if(this.d===1) return this.n<0 ? "−"+Math.abs(this.n) : ""+this.n;
    const sign = this.n<0 ? "−" : "";
    return sign + Math.abs(this.n) + "/" + this.d;
  }
}
function F(n,d){return new Frac(n,d||1)}

function isFiniteDecimal(frac){
  let d=frac.d;
  while(d%2===0) d/=2;
  while(d%5===0) d/=5;
  return d===1;
}
function fmtNum(x, nDec){
  if(nDec===undefined) nDec=4;
  let s = x.toFixed(nDec);
  if(s.indexOf(".")>=0) s = s.replace(/0+$/,"").replace(/\.$/,"");
  return s.replace("-","−").replace(".",",");
}
function intHTML(n){return n<0 ? "−"+Math.abs(n) : ""+n}

/* ====== Tạo lựa chọn (đã test) ====== */
function makeOptionsFrac(correct, distractors){
  const seen = new Set();
  const opts = [];
  function add(f){
    const k = f.toLabel();
    if(seen.has(k)) return;
    seen.add(k); opts.push(f);
  }
  add(correct);
  for(const f of distractors){ if(opts.length>=4) break; add(f); }
  let guard=0;
  while(opts.length<4 && guard<30){
    guard++;
    const dn = correct.n + randInt(-5,5)*(randInt(1,3));
    const dd = correct.d + randInt(0,2);
    try{ const f=new Frac(dn || 1, Math.max(1,dd)); add(f);}catch(e){}
  }
  const shuffled = shuffle(opts);
  const idx = shuffled.findIndex(o=>o.eq(correct));
  return { options: shuffled.map(o=>o.toLabel()), answerIdx: idx };
}

function makeOptionsStr(correctLabel, distractorLabels){
  const seen=new Set([correctLabel]);
  const opts=[correctLabel];
  for(const d of distractorLabels){if(opts.length>=4) break; if(d!=null && !seen.has(d)){seen.add(d);opts.push(d)}}
  if(opts.length<4){
    const m = correctLabel.replace("−","-").replace(",",".");
    const v = parseFloat(m);
    if(Number.isFinite(v)){
      const fmts = [v+1, v-1, v+2, v-2, v*2, Math.round(v/2)];
      for(const cand of fmts){
        if(opts.length>=4) break;
        const s = (cand<0?"−"+Math.abs(cand):""+cand);
        if(!seen.has(s)){ seen.add(s); opts.push(s); }
      }
    }
  }
  let pad = 1;
  while(opts.length<4){
    const s = "≈" + pad;
    if(!seen.has(s)){ seen.add(s); opts.push(s); }
    pad++;
  }
  const shuffled = shuffle(opts);
  return { options: shuffled, answerIdx: shuffled.indexOf(correctLabel) };
}

/* ========================================================================
   PHẦN 2 — TIỆN ÍCH GIẢI THÍCH
   Mỗi câu sẽ có explain = {correctHTML, steps[], realWorld}
   ========================================================================*/

// Mô tả "đời thường" cho số nguyên (nợ/có/tiền)
function realIntAdd(a,b){
  // Hình dung qua tiền/nợ
  if(a>=0 && b>=0) return "Kim có "+a+" nghìn, được mẹ cho thêm "+b+" nghìn → tổng "+(a+b)+" nghìn.";
  if(a<0 && b<0) return "Kim đang nợ "+Math.abs(a)+" nghìn, nợ thêm "+Math.abs(b)+" nghìn nữa → tổng nợ "+(Math.abs(a)+Math.abs(b))+" nghìn (tức "+(a+b)+").";
  if(a<0 && b>0){
    if(a+b>=0) return "Kim đang nợ "+Math.abs(a)+" nghìn, được cho "+b+" nghìn. Trả nợ xong còn "+(a+b)+" nghìn.";
    return "Kim đang nợ "+Math.abs(a)+" nghìn, được cho "+b+" nghìn. Trả bớt vẫn còn nợ "+Math.abs(a+b)+" nghìn (tức "+(a+b)+").";
  }
  // a>=0, b<0
  if(a+b>=0) return "Kim có "+a+" nghìn, tiêu "+Math.abs(b)+" nghìn → còn "+(a+b)+" nghìn.";
  return "Kim có "+a+" nghìn, nhưng cần tiêu "+Math.abs(b)+" nghìn → bị thiếu, thành nợ "+Math.abs(a+b)+" nghìn (tức "+(a+b)+").";
}
function realIntSub(a,b){
  // a − b = a + (−b)
  return "Phép trừ "+intHTML(a)+" − "+intHTML(b)+" có thể đổi thành "+intHTML(a)+" + "+intHTML(-b)+". " + realIntAdd(a, -b);
}
function realMul(a,b){
  if(a>0 && b>0) return "Hình dung "+a+" hộp bút, mỗi hộp "+b+" cây → tổng "+(a*b)+" cây bút.";
  if(a<0 && b<0) return "Hai số âm nhân nhau ra số dương: như khi 'nhân đôi khoản nợ ngược lại' → trở thành dư. Kết quả "+(a*b)+".";
  if(a<0 || b<0){
    const pos = a<0 ? b : a;
    const neg = a<0 ? a : b;
    return "Nhân số dương "+pos+" với số âm "+intHTML(neg)+" → kết quả âm. Hình dung "+pos+" tháng mỗi tháng tiêu hết "+Math.abs(neg)+" nghìn (số tiền giảm), tổng giảm "+(pos*Math.abs(neg))+" nghìn (tức "+(a*b)+").";
  }
  return "Kết quả "+(a*b)+".";
}
function realDiv(a,b){
  if(a>0 && b>0) return "Chia "+a+" viên kẹo cho "+b+" bạn, mỗi bạn được "+(a/b)+" viên.";
  return "Quy tắc dấu khi chia giống nhân: cùng dấu → dương, khác dấu → âm. Kết quả "+(a/b)+".";
}

function fmtFracSimple(n,d){ return d===1 ? ""+n : n+"/"+d; }
function realFracAdd(a,b,c,d, rN, rD){
  return "Như chia bánh: "+fmtFracSimple(a,b)+" cái bánh cộng thêm "+fmtFracSimple(c,d)+" cái bánh được "+fmtFracSimple(rN,rD)+" cái bánh. Trước đó cần quy đồng để hai miếng cùng kích thước.";
}
function realFracSub(a,b,c,d, rN, rD){
  return "Như chia bánh: có "+fmtFracSimple(a,b)+" cái bánh, cho đi "+fmtFracSimple(c,d)+" cái → còn "+fmtFracSimple(rN,rD)+" cái bánh.";
}
function realFracMul(a,b,c,d, rN, rD){
  return "Như lấy '"+fmtFracSimple(c,d)+" của "+fmtFracSimple(a,b)+"': nhân tử với tử, mẫu với mẫu rồi rút gọn → "+fmtFracSimple(rN,rD)+".";
}
function realFracDiv(){
  return "Chia hai phân số: 'lật ngược phân số thứ hai rồi nhân'. Ví dụ chia 1/2 cho 1/4 nghĩa là hỏi 'trong nửa cái bánh có mấy miếng 1/4' → có 2 miếng.";
}

/* ========================================================================
   PHẦN 3 — SINH ĐỀ NHÓM A (LỚP 6)
   ========================================================================*/

/* ---------- Chặng 1: Bảng cửu chương & Tính nhẩm ---------- */

function genQ_mulTable(){
  const a = randInt(2,9), b = randInt(2,9);
  const ans = a*b;
  const correct = ""+ans;
  const distractors = [""+(ans+a), ""+(ans-a), ""+(ans+b), ""+(ans-b)].filter(x=>x!==correct);
  const mo = makeOptionsStr(correct, shuffle(distractors));
  return {
    qHTML: "Tính nhanh: <b>"+a+" × "+b+"</b> = ?",
    options: mo.options, answerIdx: mo.answerIdx, tag:"Bảng cửu chương",
    explain: {
      correctHTML: a+" × "+b+" = <b>"+ans+"</b>",
      steps: [
        "Đếm "+a+" nhóm, mỗi nhóm "+b+": cộng "+b+" với chính nó "+a+" lần.",
        "Có thể nhớ qua bảng cửu chương "+a+" (hoặc "+b+")."
      ],
      realWorld: "Hình dung Kim có "+a+" hộp bút, mỗi hộp "+b+" cây bút → tổng "+ans+" cây bút."
    }
  };
}

function genQ_divTable(){
  const a = randInt(2,9), b = randInt(2,9);
  const dividend = a*b;
  const ans = b;
  const correct = ""+ans;
  const distractors = [""+(ans+1), ""+Math.max(1,ans-1), ""+a, ""+(a*2)].filter(x=>x!==correct);
  const mo = makeOptionsStr(correct, shuffle(distractors));
  return {
    qHTML: "Tính nhanh: <b>"+dividend+" ÷ "+a+"</b> = ?",
    options: mo.options, answerIdx: mo.answerIdx, tag:"Chia trong bảng",
    explain: {
      correctHTML: dividend+" ÷ "+a+" = <b>"+ans+"</b>",
      steps: [
        "Hỏi ngược: \""+a+" nhân mấy bằng "+dividend+"?\" → đáp "+ans+".",
        "Hoặc nhẩm bảng cửu chương "+a+"."
      ],
      realWorld: "Hình dung chia "+dividend+" viên kẹo cho "+a+" bạn, mỗi bạn được "+ans+" viên."
    }
  };
}

function genQ_quickAddSub(){
  const op = pick(["+","−"]);
  const a = randInt(-15,15);
  const b = randInt(-15,15);
  const ans = op==="+" ? a+b : a-b;
  const correct = intHTML(ans);
  const distractors = [intHTML(ans+1), intHTML(ans-1), intHTML(-ans), intHTML(a+b+a-b!==ans?a+b:a-b)].filter(x=>x!==correct);
  const mo = makeOptionsStr(correct, shuffle(distractors));
  return {
    qHTML: "Tính nhanh: <b>"+intHTML(a)+" "+op+" "+intHTML(b)+"</b> = ?",
    options: mo.options, answerIdx: mo.answerIdx, tag:"Tính nhẩm",
    explain: {
      correctHTML: intHTML(a)+" "+op+" "+intHTML(b)+" = <b>"+intHTML(ans)+"</b>",
      steps: op==="+"
        ? [
            "Cộng hai số nguyên: cùng dấu thì cộng giá trị tuyệt đối và giữ dấu; khác dấu thì lấy hiệu rồi giữ dấu của số có giá trị tuyệt đối lớn hơn.",
            "Ở đây: "+intHTML(a)+" + "+intHTML(b)+" = "+intHTML(ans)+"."
          ]
        : [
            "Phép trừ "+intHTML(a)+" − "+intHTML(b)+" có thể chuyển thành cộng số đối: "+intHTML(a)+" + "+intHTML(-b)+".",
            "Tính: "+intHTML(a)+" + "+intHTML(-b)+" = "+intHTML(ans)+"."
          ],
      realWorld: op==="+" ? realIntAdd(a,b) : realIntSub(a,b)
    }
  };
}

/* ---------- Chặng 2: Số nguyên & Quy tắc dấu ---------- */

function genQ_intArith(){
  const op = pick(["+","−","×","÷"]);
  let a, b, ans;
  if(op==="÷"){
    // chọn b chia hết cho ans
    b = pick([-9,-8,-6,-5,-4,-3,-2,2,3,4,5,6,8,9]);
    const q = randInt(-9,9);
    a = b*q;
    ans = q;
  } else if(op==="×"){
    a = randInt(-9,9); b = randInt(-9,9);
    ans = a*b;
  } else {
    a = randInt(-25,25); b = randInt(-25,25);
    ans = op==="+" ? a+b : a-b;
  }
  const correct = intHTML(ans);
  const distractors = [intHTML(ans+1), intHTML(ans-1), intHTML(-ans), intHTML(ans+2)].filter(x=>x!==correct);
  const mo = makeOptionsStr(correct, shuffle(distractors));
  let steps, realWorld;
  if(op==="+"){
    steps = ["Cộng số nguyên: cùng dấu cộng trị tuyệt đối giữ dấu; khác dấu lấy hiệu, dấu theo số trị tuyệt đối lớn hơn.","Kết quả: "+intHTML(a)+" + "+intHTML(b)+" = "+intHTML(ans)+"."];
    realWorld = realIntAdd(a,b);
  } else if(op==="−"){
    steps = ["Trừ = cộng số đối: "+intHTML(a)+" − "+intHTML(b)+" = "+intHTML(a)+" + "+intHTML(-b)+".","Tính: = "+intHTML(ans)+"."];
    realWorld = realIntSub(a,b);
  } else if(op==="×"){
    steps = ["Quy tắc dấu khi nhân: cùng dấu → dương; khác dấu → âm.","Trị tuyệt đối: "+Math.abs(a)+" × "+Math.abs(b)+" = "+Math.abs(ans)+". Vậy "+intHTML(a)+" × "+intHTML(b)+" = "+intHTML(ans)+"."];
    realWorld = realMul(a,b);
  } else {
    steps = ["Quy tắc dấu khi chia giống nhân: cùng dấu → dương; khác dấu → âm.","Trị tuyệt đối: "+Math.abs(a)+" ÷ "+Math.abs(b)+" = "+Math.abs(ans)+". Vậy "+intHTML(a)+" ÷ "+intHTML(b)+" = "+intHTML(ans)+"."];
    realWorld = realDiv(a,b);
  }
  return {
    qHTML: "Tính: <b>"+intHTML(a)+" "+op+" "+intHTML(b)+"</b> = ?",
    options: mo.options, answerIdx: mo.answerIdx, tag:"Số nguyên",
    explain: { correctHTML: intHTML(a)+" "+op+" "+intHTML(b)+" = <b>"+intHTML(ans)+"</b>", steps, realWorld }
  };
}

function genQ_parens(){
  // Bỏ dấu ngoặc: a − (b ± c) hoặc a + (b ± c)
  const outerSign = pick(["+","−"]);
  const innerOp = pick(["+","−"]);
  const a = randInt(-12,12), b = randInt(-12,12), c = randInt(-12,12);
  const inner = innerOp==="+" ? (b+c) : (b-c);
  const ans = outerSign==="+" ? a+inner : a-inner;
  const correct = intHTML(ans);
  const distractors = [
    intHTML(outerSign==="−" ? a - b + c : a + b - c),
    intHTML(outerSign==="−" ? a - b - c : a + b + c),
    intHTML(ans+1),
    intHTML(-ans)
  ].filter(x=>x!==correct);
  const mo = makeOptionsStr(correct, shuffle(distractors));
  const expr = intHTML(a)+" "+outerSign+" ("+intHTML(b)+" "+innerOp+" "+intHTML(c)+")";
  let stepText;
  if(outerSign==="−"){
    // bỏ ngoặc có dấu trừ trước: đổi dấu hết bên trong
    const flippedInnerOp = innerOp==="+" ? "−" : "+";
    stepText = [
      "Trước ngoặc có dấu trừ → bỏ ngoặc thì ĐỔI DẤU mọi số bên trong.",
      "Vậy "+expr+" = "+intHTML(a)+" "+(innerOp==="+"?"−":"+")+" "+Math.abs(b)+" "+flippedInnerOp+" "+Math.abs(c)+" = "+intHTML(ans)+"."
    ];
  } else {
    stepText = [
      "Trước ngoặc có dấu cộng → bỏ ngoặc giữ nguyên dấu các số bên trong.",
      "Tính: "+expr+" = "+intHTML(a)+" + ("+intHTML(inner)+") = "+intHTML(ans)+"."
    ];
  }
  return {
    qHTML: "Bỏ ngoặc rồi tính: <b>"+expr+"</b> = ?",
    options: mo.options, answerIdx: mo.answerIdx, tag:"Quy tắc dấu ngoặc",
    explain: {
      correctHTML: expr+" = <b>"+intHTML(ans)+"</b>",
      steps: stepText,
      realWorld: outerSign==="−"
        ? "Hình dung: Kim mượn của bạn 'một gói gồm "+intHTML(b)+" và "+intHTML(c)+"'. Khi lấy ngược lại (trả về), Kim phải đổi dấu hết — mượn thành trả, có thành nợ."
        : "Hình dung: thêm vào một gói gồm hai khoản — gói thế nào, thêm thế đó, dấu giữ nguyên."
    }
  };
}

function genQ_intOrder(){
  const variant = pick([1,2,3]);
  let expr, ans, stepExplain;
  if(variant===1){
    const a=randInt(-9,9), b=randInt(2,9), c=randInt(2,9);
    ans = a + b*c;
    expr = intHTML(a)+" + "+b+" × "+c;
    stepExplain = "Thứ tự: nhân trước, cộng sau. "+b+" × "+c+" = "+(b*c)+", rồi "+intHTML(a)+" + "+(b*c)+" = "+intHTML(ans)+".";

function genQ_fracBasicPos(){
  // Phép tính 4 phép tính phân số DƯƠNG đơn giản (lớp 6)
  const op = pick(["+","−","×","÷"]);
  function pos(){
    const d = pick([2,3,4,5,6,8]);
    let n = randInt(1, d);
    return F(n,d);
  }
  let a = pos(), b = pos();
  // đảm bảo a−b ≥ 0 cho phép trừ
  if(op==="−" && a.toNum() < b.toNum()){ const t=a; a=b; b=t; }
  let ans;
  if(op==="+") ans = a.add(b);
  else if(op==="−") ans = a.sub(b);
  else if(op==="×") ans = a.mul(b);
  else ans = a.div(b);
  const distractors = [];
  try{ if(op==="+") distractors.push(new Frac(a.n+b.n, a.d+b.d)); }catch(e){}
  try{ distractors.push(a.add(b)); }catch(e){}
  try{ distractors.push(a.mul(b)); }catch(e){}
  if(b.n!==0) try{ distractors.push(a.div(b)); }catch(e){}
  distractors.push(F(ans.n+1, ans.d || 1));
  const mo = makeOptionsFrac(ans, shuffle(distractors.filter(d=>!d.eq(ans))));
  // Build steps depending on op
  let steps, realWorld;
  if(op==="+" || op==="−"){
    const L = lcm(a.d, b.d);
    const an = a.n*(L/a.d), bn = b.n*(L/b.d);
    const rn = op==="+" ? an+bn : an-bn;
    steps = [
      "Quy đồng mẫu: mẫu chung là "+L+". "+a.toLabel()+" = "+an+"/"+L+"; "+b.toLabel()+" = "+bn+"/"+L+".",
      (op==="+"?"Cộng tử với tử: ":"Trừ tử cho tử: ")+an+(op==="+"?"+":"−")+bn+" = "+rn+", giữ mẫu "+L+".",
      "Rút gọn (nếu được): "+rn+"/"+L+" = "+ans.toLabel()+"."
    ];
    realWorld = op==="+"
      ? realFracAdd(a.n,a.d,b.n,b.d, ans.n, ans.d)
      : realFracSub(a.n,a.d,b.n,b.d, ans.n, ans.d);
  } else if(op==="×"){
    steps = [
      "Nhân hai phân số: nhân tử với tử, mẫu với mẫu.",
      a.toLabel()+" × "+b.toLabel()+" = ("+a.n+"×"+b.n+")/("+a.d+"×"+b.d+") = "+(a.n*b.n)+"/"+(a.d*b.d)+".",
      "Rút gọn về "+ans.toLabel()+"."
    ];
    realWorld = realFracMul(a.n,a.d,b.n,b.d, ans.n, ans.d);
  } else {
    steps = [
      "Chia hai phân số: lật ngược phân số sau rồi nhân.",
      a.toLabel()+" ÷ "+b.toLabel()+" = "+a.toLabel()+" × "+b.d+"/"+b.n+" = "+(a.n*b.d)+"/"+(a.d*b.n)+".",
      "Rút gọn về "+ans.toLabel()+"."
    ];
    realWorld = realFracDiv();
  }
  return {
    qHTML: "Tính: "+a.toHTML()+" "+op+" "+b.toHTML()+" = ?",
    options: mo.options, answerIdx: mo.answerIdx, tag:"Phân số lớp 6",
    explain: { correctHTML: a.toLabel()+" "+op+" "+b.toLabel()+" = <b>"+ans.toLabel()+"</b>", steps, realWorld }
  };
}

   PHẦN 3B — SINH ĐỀ PHẦN 2 (Ôn lớp 6: ƯCLN, BCNN & Chia hết) — MỚI v3
   ========================================================================*/

function divisorsOf(n){
  const res=[]; for(let i=1;i<=n;i++){ if(n%i===0) res.push(i); } return res;
}
function isPrime(n){
  if(n<2) return false;
  if(n<4) return true;
  if(n%2===0) return false;
  for(let i=3;i*i<=n;i+=2){ if(n%i===0) return false; }
  return true;
}
function primeFactors(n){
  const f={}; let x=n; let p=2;
  while(x>1){
    while(x%p===0){ f[p]=(f[p]||0)+1; x/=p; }
    p++;
    if(p*p>x && x>1){ f[x]=(f[x]||0)+1; x=1; }
  }
  return f; // map prime -> exp
}
function formatFactorization(f){
  const ks = Object.keys(f).map(Number).sort((a,b)=>a-b);
  return ks.map(p=>f[p]===1?(""+p):(p+"<sup>"+f[p]+"</sup>")).join(" × ");
}
function formatFactorizationPlain(f){
  const ks = Object.keys(f).map(Number).sort((a,b)=>a-b);
  return ks.map(p=>f[p]===1?(""+p):(p+"^"+f[p])).join("×");
}

    else if(d===5){ rule="Chia hết cho 5 khi tận cùng là 0 hoặc 5."; proof="Tận cùng của "+a+" là "+((""+a).slice(-1))+" → "+(ok?"là 0 hoặc 5":"không phải 0 cũng không phải 5")+"."; }
    else { const sum = (""+a).split("").reduce((s,c)=>s+(+c),0); rule="Chia hết cho "+d+" khi tổng các chữ số chia hết cho "+d+"."; proof="Tổng chữ số của "+a+" = "+sum+", và "+sum+(sum%d===0?" chia hết cho ":" không chia hết cho ")+d+"."; }

      }
    };
  }
}

    const composites = [4,6,8,9,10,12,14,15,16,18,20,21,22,24,25,26,27,28,30,32,33,35,36,38,39,40,42,44,45,46,48,49,50,51,52,54,55,56,57,58,60,62,63,64,65,66,68,69,70,72,74,75,76,77,78,80,81,82,84,85,86,87,88,90,91,92,93,94,95,96,98,99];
    const p = pick(primes);
    const cs = shuffle(composites).slice(0,3);
    const opts = shuffle([""+p, ...cs.map(x=>""+x)]);
    return {

}

function genQ_primeFactorize(){
  // Sinh n nhỏ rồi yêu cầu phân tích
  const pool = [12,18,20,24,28,30,36,40,42,45,48,50,54,56,60,63,64,72,75,80,84,90,96,100];
  const n = pick(pool);
  const f = primeFactors(n);
  const correctHTML = formatFactorization(f);
  const correctPlain = formatFactorizationPlain(f);
  // Tạo 3 đáp án sai bằng cách bóp méo phân tích
  function corrupt(){
    // Hoán đổi mũ, đổi prime nhỏ → prime khác (vẫn factor), hoặc nhân thêm 1 prime sai
    const ks = Object.keys(f).map(Number);
    const choice = randInt(1,3);
    const g = {};
    Object.keys(f).forEach(k=>g[k]=f[k]);
    if(choice===1 && ks.length>0){
      const k = pick(ks);
      g[k] = g[k]+1; // tăng 1 mũ → sai
    } else if(choice===2){
      // đổi 1 prime sang prime khác
      const others = [2,3,5,7,11,13].filter(p=>!(p in f));
      if(ks.length>0 && others.length>0){
        const oldK = pick(ks);
        const newK = pick(others);
        g[newK]=g[oldK]; delete g[oldK];
      } else {
        const k = pick(ks); g[k]=Math.max(1,g[k]-1);
      }
    } else {
      // thêm 1 prime với mũ 1
      const others = [2,3,5,7,11,13].filter(p=>!(p in f));
      if(others.length>0) g[pick(others)]=1;
      else { const k=pick(ks); g[k]=g[k]+1; }
    }
    return g;
  }
  const seen = new Set([correctPlain]);
  const wrongs = [];
  let guard=0;
  while(wrongs.length<3 && guard<40){
    guard++;
    const g = corrupt();
    const plain = formatFactorizationPlain(g);
    if(!seen.has(plain)){ seen.add(plain); wrongs.push({plain, html:formatFactorization(g)}); }
  }
  while(wrongs.length<3){
    wrongs.push({plain:"2×3", html:"2 × 3"});
  }
  // Render options as HTML strings (mã hoá riêng vì có sup)
  const optsObjects = shuffle([{plain:correctPlain, html:correctHTML}, ...wrongs]);
  const optLabels = optsObjects.map(o=>"__html__"+o.html);
  const answerIdx = optsObjects.findIndex(o=>o.plain===correctPlain);
  // Bước phân tích
  const steps = [];
  steps.push("Chia "+n+" liên tục cho các số nguyên tố nhỏ nhất.");
  let x=n; const traces=[];
  const ks = Object.keys(f).map(Number).sort((a,b)=>a-b);
  for(const p of ks){
    for(let i=0;i<f[p];i++){
      traces.push(x+" ÷ "+p+" = "+(x/p));
      x = x/p;
    }
  }
  steps.push("Quá trình: "+traces.join("; ")+".");
  steps.push("Vậy "+n+" = "+correctHTML+".");
  return {
    qHTML: "Phân tích số <b>"+n+"</b> ra thừa số nguyên tố:",
    options: optLabels, answerIdx, tag:"Phân tích thừa số",
    explain:{
      correctHTML: n + " = <b>" + correctHTML + "</b>",
      steps,
      realWorld: "Như việc 'phá' số "+n+" thành các viên gạch nguyên tố — bộ gạch cơ bản nhất, không phá nhỏ hơn được nữa."
    }
  };
}

function fmtMoney(n){
  // ngăn cách nghìn bằng dấu chấm
  return (""+Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,".");
}
function nameOf(){ return pick(["An","Bình","Nam","Lan","Hà","Mai","Minh","Tú","Hoa","Sơn"]); }
// Tạo 4 lựa chọn không trùng: đáp án đúng + tối đa 3 đáp án sai từ pool (đã loại trùng correct & trùng nhau).
function build4Opts(correctStr, pool, fallbackFn){
  const seen = new Set([correctStr]);
  const wrongs = [];
  for(const s of pool){
    if(wrongs.length>=3) break;
    if(s==null) continue;
    const k = ""+s;
    if(seen.has(k)) continue;
    seen.add(k); wrongs.push(k);
  }
  let guard=0;
  while(wrongs.length<3 && guard<60){
    guard++;
    const cand = fallbackFn ? fallbackFn(seen) : null;
    if(cand==null) break;
    const k = ""+cand;
    if(!seen.has(k)){ seen.add(k); wrongs.push(k); }
  }
  while(wrongs.length<3){ wrongs.push(correctStr+"?"+wrongs.length); seen.add(correctStr+"?"+wrongs.length); }
  const opts = shuffle([correctStr, ...wrongs]);
  return { options: opts, answerIdx: opts.indexOf(correctStr) };
}

/* ---- Chặng 3.1 — Toán đố số học cơ bản ---- */
function genQ_word_arith(){
  const variant = pick([1,2,3,4]);
  if(variant===1){
    // Có – cho – nhận: x - y + z, đảm bảo >=0
    const n1 = nameOf(); let n2 = nameOf(); while(n2===n1) n2=nameOf();
    const x = randInt(20,80);
    const y = randInt(3, Math.min(15,x));
    const z = randInt(3, 20);
    const ans = x - y + z;
    const correct = ""+ans;
    const pool = shuffle([""+(x-y), ""+(x+y+z), ""+(x+y-z), ""+(x-y-z), ""+(ans+1), ""+(ans-1), ""+(ans+2), ""+(ans-2), ""+x]);
    const mo = build4Opts(correct, pool, seen=>{ let d=1; while(d<50){ const cand=""+(ans+d); if(!seen.has(cand)) return cand; d++; } return null; });
    return {
      qHTML: "<span class=\"scenario\">Tình huống:</span> "+n1+" có <b>"+x+"</b> viên kẹo. "+n1+" cho "+n2+" <b>"+y+"</b> viên, sau đó mẹ cho thêm <b>"+z+"</b> viên. Hỏi "+n1+" còn bao nhiêu viên kẹo?",
      options: mo.options, answerIdx: mo.answerIdx, tag:"Toán đố · Số học",
      explain:{
        correctHTML: n1 + " còn <b>" + ans + "</b> viên kẹo.",
        steps:[
          "Bước 1: Bắt đầu với "+x+" viên.",
          "Bước 2: Cho đi "+y+" viên → còn "+(x-y)+" viên.",
          "Bước 3: Nhận thêm "+z+" viên → tổng "+(x-y)+" + "+z+" = "+ans+" viên."
        ],
        realWorld: "Đọc đề: 'có – cho – cho thêm' → phép trừ rồi cộng. Đây là cách diễn lời văn thành phép tính: cho = trừ, nhận = cộng."
      }
    };
  } else if(variant===2){
    // Mua hàng - tiền: có x, mua a quyển vở giá b/quyển. Còn bao nhiêu?
    const n1 = nameOf();
    const have = pick([20,30,50,100,150,200])*1000;
    const unit = pick([3,5,7,8,10,12,15])*1000;
    const qty = randInt(2, Math.min(8, Math.floor(have/unit)));
    const cost = unit*qty;
    const left = have - cost;
    const ansStr = fmtMoney(left)+"đ";
    const pool = shuffle([
      fmtMoney(have)+"đ",
      fmtMoney(cost)+"đ",
      fmtMoney(left + unit)+"đ",
      Math.max(0,left - unit)>0 ? fmtMoney(left - unit)+"đ" : null,
      fmtMoney(have + cost)+"đ",
      fmtMoney(left + 1000)+"đ",
      fmtMoney(Math.max(0,left - 1000))+"đ"
    ]);
    const mo = build4Opts(ansStr, pool, seen=>{ let d=1000; while(d<200000){ const cand=fmtMoney(left+d)+"đ"; if(!seen.has(cand)) return cand; d+=1000; } return null; });
    return {
      qHTML: "<span class=\"scenario\">Tình huống:</span> "+n1+" có "+fmtMoney(have)+"đ. "+n1+" mua <b>"+qty+"</b> quyển vở, mỗi quyển giá "+fmtMoney(unit)+"đ. Hỏi "+n1+" còn lại bao nhiêu tiền?",
      options: mo.options, answerIdx: mo.answerIdx, tag:"Toán đố · Mua hàng",
      explain:{
        correctHTML: n1 + " còn <b>" + ansStr + "</b>.",
        steps:[
          "Tổng tiền vở: "+qty+" × "+fmtMoney(unit)+"đ = "+fmtMoney(cost)+"đ.",
          "Số tiền còn lại: "+fmtMoney(have)+"đ − "+fmtMoney(cost)+"đ = "+ansStr+"."
        ],
        realWorld: "Lời văn 'mua a cái, giá b' → nhân (a×b) tính tổng, rồi 'còn lại' là trừ."
      }
    };
  } else if(variant===3){
    // Tổng – hiệu (đảm bảo tổng + hiệu cùng tính chẵn)
    const small = randInt(5,30);
    const big = small + randInt(3,20);
    const sum = small+big;
    const diff = big-small;
    const askBig = Math.random()<0.5;
    const ans = askBig?big:small;
    const correct = ""+ans;
    const pool = shuffle([""+(askBig?small:big), ""+sum, ""+diff, ""+(ans+1), ""+(ans-1), ""+(sum-diff), ""+(ans+2), ""+(ans-2)]);
    const mo = build4Opts(correct, pool, seen=>{ let d=1; while(d<60){ const c=""+(ans+d); if(!seen.has(c)) return c; d++; } return null; });
    return {
      qHTML: "<span class=\"scenario\">Tình huống:</span> Lớp 6A có "+sum+" bạn, trong đó số bạn nam nhiều hơn số bạn nữ "+diff+" bạn. Hỏi lớp có bao nhiêu bạn <b>"+(askBig?"nam":"nữ")+"</b>?",
      options: mo.options, answerIdx: mo.answerIdx, tag:"Toán đố · Tổng – hiệu",
      explain:{
        correctHTML: "Số bạn "+(askBig?"nam":"nữ")+" = <b>"+ans+"</b>",
        steps:[
          "Đây là bài toán Tổng – Hiệu. Số lớn = (Tổng + Hiệu) ÷ 2; Số bé = (Tổng − Hiệu) ÷ 2.",
          "Số nam = ("+sum+" + "+diff+") ÷ 2 = "+big+". Số nữ = ("+sum+" − "+diff+") ÷ 2 = "+small+".",
          "Đáp số: "+(askBig?"nam = "+big:"nữ = "+small)+"."
        ],
        realWorld: "Hình dung tổng là cả lớp, hiệu là chênh nam–nữ. Nửa của (tổng+hiệu) là số nam; nửa của (tổng−hiệu) là số nữ."
      }
    };
  } else {
    // Gấp k lần - hiệu d: x gấp k thì hơn x đúng d → x = d/(k-1) (đảm bảo chia hết)
    const k = pick([2,3,4,5]);
    const x = randInt(4,20);
    const diff = x*(k-1);
    const ans = x;
    const correct = ""+ans;
    const pool = shuffle([""+(k*x), ""+(diff), ""+(diff+1), ""+(ans+1), ""+(ans-1), ""+Math.max(1,(diff/k|0)), ""+(ans+k), ""+(ans+2)]);
    const mo = build4Opts(correct, pool, seen=>{ let d=1; while(d<40){ const c=""+(ans+d); if(!seen.has(c)) return c; d++; } return null; });
    return {
      qHTML: "<span class=\"scenario\">Tình huống:</span> Một số khi gấp lên <b>"+k+" lần</b> thì hơn số đó <b>"+diff+"</b> đơn vị. Hỏi số đó là bao nhiêu?",
      options: mo.options, answerIdx: mo.answerIdx, tag:"Toán đố · Gấp – kém",
      explain:{
        correctHTML: "Số cần tìm = <b>"+ans+"</b>",
        steps:[
          "Gọi số đó là x. Khi gấp "+k+" lần ta được "+k+"·x.",
          ""+k+"·x − x = ("+k+"−1)·x = "+(k-1)+"·x = "+diff+" → x = "+diff+" ÷ "+(k-1)+" = "+ans+".",
          "Thử lại: "+x+" × "+k+" = "+(x*k)+", lớn hơn "+x+" đúng "+diff+" đơn vị. ✓"
        ],
        realWorld: "Diễn lại lời văn: 'gấp k lần thì hơn d' → 'khoảng cách giữa số ban đầu và (k lần) là d' → chia d cho (k−1)."
      }
    };
  }
}

/* ---- Chặng 3.2 — Toán đố phân số & tỉ số phần trăm ---- */
function genQ_word_fracPct(){
  const variant = pick([1,2,3,4]);
  if(variant===1){
    // Ăn 1/k cái → còn lại (k-1)/k cái (số nguyên)
    const k = pick([2,3,4,5,6]);
    const total = k * pick([3,4,5,6,8,10]); // chia hết k
    const eaten = total/k;
    const left = total - eaten;
    const correct = ""+left;
    const pool = shuffle([""+eaten, ""+total, ""+(left+1), Math.max(0,left-1)+"", ""+(total-2*eaten), ""+k, ""+(left+k), ""+(left+2)]);
    const mo = build4Opts(correct, pool, seen=>{ let d=1; while(d<60){ const c=""+(left+d); if(!seen.has(c)) return c; d++; } return null; });
    return {
      qHTML: "<span class=\"scenario\">Tình huống:</span> Mẹ làm <b>"+total+"</b> cái bánh. Cả nhà ăn hết <b>1/"+k+"</b> số bánh. Hỏi còn lại bao nhiêu cái bánh?",
      options: mo.options, answerIdx: mo.answerIdx, tag:"Toán đố · Phân số",
      explain:{
        correctHTML: "Còn lại <b>"+left+"</b> cái bánh.",

          "Số bánh đã ăn = 1/"+k+" × "+total+" = "+total+" ÷ "+k+" = "+eaten+" cái.",
          "Số bánh còn lại = "+total+" − "+eaten+" = "+left+" cái.",
          "Cách khác: còn "+(k-1)+"/"+k+" số bánh = "+(k-1)+"/"+k+" × "+total+" = "+left+"."
        ],
        realWorld: "Cắt bánh thành "+k+" phần bằng nhau, ăn 1 phần → còn "+(k-1)+" phần."

  } else if(variant===2){

    const correct = ""+part;
    const pool = shuffle([""+(total-part), ""+total, ""+(part+1), Math.max(0,part-1)+"", ""+(total*a), ""+(total/b|0), ""+(part+2), ""+(part+b)]);
    const mo = build4Opts(correct, pool, seen=>{ let d=1; while(d<80){ const c=""+(part+d); if(!seen.has(c)) return c; d++; } return null; });
    return {
      qHTML: "<span class=\"scenario\">Tình huống:</span> Lớp 6A có <b>"+total+"</b> học sinh, trong đó <b>"+a+"/"+b+"</b> là học sinh nữ. Hỏi lớp có bao nhiêu học sinh <b>nữ</b>?",
      options: mo.options, answerIdx: mo.answerIdx, tag:"Toán đố · Phân số",
      explain:{
        correctHTML: "Số học sinh nữ = <b>"+part+"</b>.",
        steps:[
          "Tìm "+a+"/"+b+" của "+total+": lấy "+total+" ÷ "+b+" × "+a+".",
          total+" ÷ "+b+" = "+(total/b)+"; "+(total/b)+" × "+a+" = "+part+"."
        ],
        realWorld: "Chia tổng thành "+b+" phần bằng nhau, lấy "+a+" phần đó. Mẹo: 'của' trong tiếng Việt thường tương ứng phép NHÂN khi nói về phân số."
      }
    };
  } else if(variant===3){
    // Giảm giá p% (tròn chục %)
    const original = pick([100,150,200,250,300,400,500])*1000;
    const p = pick([10,20,25,30,40,50]);
    const sale = original * (100 - p) / 100;
    const correct = fmtMoney(sale)+"đ";
    const pool = shuffle([
      fmtMoney(original)+"đ",
      fmtMoney(original * p / 100)+"đ",
      fmtMoney(original + original*p/100)+"đ",
      fmtMoney(sale + 10000)+"đ",
      Math.max(0,sale - 10000)>=0 ? fmtMoney(Math.max(0,sale - 10000))+"đ" : null,
      fmtMoney(sale + 5000)+"đ",
      fmtMoney(sale + 1000)+"đ"
    ]);
    const mo = build4Opts(correct, pool, seen=>{ let d=1000; while(d<200000){ const c=fmtMoney(sale+d)+"đ"; if(!seen.has(c)) return c; d+=1000; } return null; });
    return {
      qHTML: "<span class=\"scenario\">Tình huống:</span> Một chiếc áo giá <b>"+fmtMoney(original)+"đ</b>. Cửa hàng <b>giảm giá "+p+"%</b>. Hỏi giá chiếc áo sau khi giảm?",
      options: mo.options, answerIdx: mo.answerIdx, tag:"Toán đố · Phần trăm",
      explain:{
        correctHTML: "Giá sau giảm = <b>"+correct+"</b>",
        steps:[
          "Số tiền được giảm = "+p+"% × "+fmtMoney(original)+"đ = "+fmtMoney(original*p/100)+"đ.",
          "Giá sau giảm = "+fmtMoney(original)+"đ − "+fmtMoney(original*p/100)+"đ = "+correct+".",
          "Cách khác: phải trả "+(100-p)+"% giá gốc = "+(100-p)+"/100 × "+fmtMoney(original)+"đ = "+correct+"."
        ],
        realWorld: "Giảm "+p+"% nghĩa là 100 đồng chỉ phải trả "+(100-p)+" đồng. Áp dụng vào số tiền lớn cũng cùng quy tắc."
      }
    };
  } else {
    // Phần trăm số học sinh giỏi
    const total = pick([20,25,40,50])*pick([1,2]);
    const part = Math.floor(total * pick([0.2,0.25,0.3,0.4,0.5,0.6,0.75]));
    // Đảm bảo part chia hết cho tỉ lệ — chọn lại đơn giản:
    const ratios = [
      {p:20, denom:5}, {p:25, denom:4}, {p:50, denom:2}, {p:75, denom:4},
      {p:10, denom:10}, {p:40, denom:5}, {p:60, denom:5}
    ];
    const r = pick(ratios);
    const total2 = r.denom * pick([3,4,5,6,8,10]);
    const part2 = total2 * r.p / 100;
    const correct = ""+part2;
    const pool = shuffle([""+(total2-part2), ""+total2, ""+(part2+1), Math.max(0,part2-1)+"", ""+Math.max(0,total2-part2-1), ""+(part2+2), ""+(part2+r.denom), ""+(part2+5)]);
    const mo = build4Opts(correct, pool, seen=>{ let d=1; while(d<60){ const c=""+(part2+d); if(!seen.has(c)) return c; d++; } return null; });
    return {
      qHTML: "<span class=\"scenario\">Tình huống:</span> Lớp 6B có <b>"+total2+"</b> học sinh, trong đó <b>"+r.p+"%</b> đạt loại giỏi. Hỏi lớp có bao nhiêu học sinh giỏi?",
      options: mo.options, answerIdx: mo.answerIdx, tag:"Toán đố · Phần trăm",
      explain:{
        correctHTML: "Số học sinh giỏi = <b>"+part2+"</b>",
        steps:[
          ""+r.p+"% của "+total2+" = "+r.p+"/100 × "+total2+" = "+part2+".",
          "Cách nhẩm: "+r.p+"% = "+r.p+"/100 = 1/"+r.denom+"; "+total2+" ÷ "+r.denom+" × "+(r.p*r.denom/100)+" = "+part2+"."
        ],
        realWorld: ""+r.p+"% nghĩa là cứ 100 bạn có "+r.p+" bạn giỏi → áp dụng tỉ lệ tương ứng cho "+total2+" bạn."
      }
    };
  }
}

// Chặng 4: Cộng/Trừ/Nhân/Chia số hữu tỉ
function genQ_ratArith(){
  const op = pick(["+","−","×","÷"]);
  function smallFrac(allowInt){
    const useInt = allowInt && Math.random()<0.35;
    if(useInt) return F(randInt(-9,9) || 2);
    let d = pick([2,3,4,5,6,8,10]);
    let n = randInt(-9,9); if(n===0) n=1;
    return F(n,d);
  }
  let a = smallFrac(true), b = smallFrac(true);
  if(op==="÷" && b.n===0) b = F(1,2);
  let ans;
  if(op==="+") ans = a.add(b);
  else if(op==="−") ans = a.sub(b);
  else if(op==="×") ans = a.mul(b);
  else ans = a.div(b);
  const distractors=[];
  try{ if(op==="+") distractors.push(new Frac(a.n+b.n, a.d+b.d)); }catch(e){}
  try{ distractors.push(a.add(b)); }catch(e){}
  try{ distractors.push(a.sub(b)); }catch(e){}
  try{ distractors.push(a.mul(b)); }catch(e){}
  if(b.n!==0) try{ distractors.push(a.div(b)); }catch(e){}
  try{ distractors.push(ans.neg()); }catch(e){}
  const mo = makeOptionsFrac(ans, shuffle(distractors.filter(d=>!d.eq(ans))));
  let steps, realWorld;
  if(op==="+" || op==="−"){
    const L = lcm(a.d, b.d);
    const an = a.n*(L/a.d), bn = b.n*(L/b.d);
    const rn = op==="+" ? an+bn : an-bn;
    steps = [
      "Quy đồng mẫu: mẫu chung "+L+". "+a.toLabel()+" = "+an+"/"+L+"; "+b.toLabel()+" = "+bn+"/"+L+".",
      (op==="+"?"Cộng tử với tử (giữ dấu): ":"Trừ tử cho tử (giữ dấu): ")+an+(op==="+"?" + ":" − ")+"("+bn+") = "+rn+".",
      "Kết quả: "+rn+"/"+L+" = "+ans.toLabel()+"."
    ];
    realWorld = "Kim cộng/trừ phân số có cả số âm cứ làm như cộng/trừ trên trục số: số âm tức là 'thiếu/nợ'.";
  } else if(op==="×"){
    steps = [
      "Nhân tử với tử, mẫu với mẫu, để ý dấu (cùng dấu → dương, khác dấu → âm).",
      a.toLabel()+" × "+b.toLabel()+" = ("+a.n+"×"+b.n+")/("+a.d+"×"+b.d+") = "+(a.n*b.n)+"/"+(a.d*b.d)+" = "+ans.toLabel()+"."
    ];
    realWorld = "Quy tắc dấu giống nhân số nguyên: âm × âm = dương, âm × dương = âm.";
  } else {
    steps = [
      "Chia hai phân số: lật ngược phân số sau rồi nhân, dấu áp dụng quy tắc nhân.",
      a.toLabel()+" ÷ "+b.toLabel()+" = "+a.toLabel()+" × "+(b.n<0?"−":"")+b.d+"/"+Math.abs(b.n)+" → kết quả "+ans.toLabel()+"."
    ];
    realWorld = "Như chia bánh phần âm: cứ tính trị tuyệt đối trước, dấu xử lý sau theo quy tắc dấu.";
  }
  return {
    qHTML: "Tính: "+a.toHTML()+" "+op+" "+b.toHTML()+" = ?",
    options: mo.options, answerIdx: mo.answerIdx, tag:"Số hữu tỉ",
    explain: { correctHTML: a.toLabel()+" "+op+" "+b.toLabel()+" = <b>"+ans.toLabel()+"</b>", steps, realWorld }
  };
}

// Chặng 5: Lũy thừa số hữu tỉ
function genQ_ratPower(){
  const variant = pick([1,2,3]);
  let qHTML, ans, base, exp, expr;
  if(variant===1){
    const d = pick([2,3,4,5]);
    let n = pick([1,2,3,-1,-2,-3]); if(n===0) n=1;
    base = F(n,d); exp = pick([2,3]);
    ans = base.pow(exp);
    qHTML = "Tính "+base.toHTML()+"<sup>"+exp+"</sup> = ?";
    expr = base.toLabel()+"^"+exp;
  } else if(variant===2){
    const a = randInt(2,7); exp = pick([2,3]);
    base = F(-a);
    ans = base.pow(exp);
    qHTML = "Tính (−"+a+")<sup>"+exp+"</sup> = ?";
    expr = "(−"+a+")^"+exp;
  } else {
    const a = randInt(2,5);
    let m = randInt(2,4), n = randInt(1,3);
    const isMul = Math.random()<0.5;
    if(isMul){
      ans = F(Math.pow(a,m+n));
      qHTML = a+"<sup>"+m+"</sup> × "+a+"<sup>"+n+"</sup> = ?";
      expr = a+"^"+m+" × "+a+"^"+n;
      var stepExtra = ["Cùng cơ số khi nhân: GIỮ cơ số, CỘNG số mũ. "+a+"^"+m+" × "+a+"^"+n+" = "+a+"^("+m+"+"+n+") = "+a+"^"+(m+n)+" = "+ans.toLabel()+"."];
    } else {
      if(m<n){const t=m; m=n; n=t}
      ans = F(Math.pow(a, m-n));
      qHTML = a+"<sup>"+m+"</sup> ÷ "+a+"<sup>"+n+"</sup> = ?";
      expr = a+"^"+m+" ÷ "+a+"^"+n;
      var stepExtra = ["Cùng cơ số khi chia: GIỮ cơ số, TRỪ số mũ. "+a+"^"+m+" ÷ "+a+"^"+n+" = "+a+"^("+m+"−"+n+") = "+a+"^"+(m-n)+" = "+ans.toLabel()+"."];
    }
  }
  const distractors = [];
  distractors.push(ans.neg());
  try{distractors.push(new Frac(ans.n*2, ans.d))}catch(e){}
  try{distractors.push(new Frac(ans.n, Math.max(1,ans.d*ans.d)))}catch(e){}
  const mo = makeOptionsFrac(ans, shuffle(distractors.filter(x=>!x.eq(ans))));
  let steps;
  if(variant===1){
    steps = [
      "Lũy thừa "+base.toLabel()+"^"+exp+" nghĩa là nhân "+base.toLabel()+" với chính nó "+exp+" lần.",
      "= ("+base.n+")^"+exp+" / ("+base.d+")^"+exp+" = "+Math.pow(base.n,exp)+"/"+Math.pow(base.d,exp)+" = "+ans.toLabel()+".",
      "Lưu ý dấu: số âm mũ chẵn → dương; mũ lẻ → âm."
    ];
  } else if(variant===2){
    steps = [
      "(−"+Math.abs(base.n)+")^"+exp+" = (−"+Math.abs(base.n)+") nhân với chính nó "+exp+" lần.",
      "Mũ "+(exp%2===0?"chẵn → kết quả DƯƠNG":"lẻ → kết quả ÂM")+".",
      "Trị tuyệt đối: "+Math.abs(base.n)+"^"+exp+" = "+Math.pow(Math.abs(base.n),exp)+", có dấu là "+ans.toLabel()+"."
    ];
  } else {
    steps = stepExtra;
  }
  return {
    qHTML, options: mo.options, answerIdx: mo.answerIdx, tag:"Lũy thừa",
    explain: {
      correctHTML: expr+" = <b>"+ans.toLabel()+"</b>",
      steps,
      realWorld: "Hình dung lũy thừa như 'nhân đôi/nhân ba lặp lại': 2^3 = 2×2×2 = 8, giống một tế bào chia ba lần thành 8 tế bào."
    }
  };
}

// Chặng 5: Thứ tự phép tính (mức lớp 7 — có ngoặc + phép tính kết hợp)
function genQ_ratOrder(){
  const variant = pick([1,2,3,4]);
  let expr, ans, stepLine;
  if(variant===1){
    const a=randInt(-9,9), b=randInt(2,9), c=randInt(2,9);
    ans = F(a + b*c);
    expr = intHTML(a) + " + " + b + " × " + c;
    stepLine = "Nhân trước: "+b+"×"+c+" = "+(b*c)+". Rồi "+intHTML(a)+" + "+(b*c)+" = "+intHTML(a+b*c)+".";
  } else if(variant===2){
    const a=randInt(-9,9), b=randInt(-9,9), c=randInt(2,9);
    ans = F((a+b)*c);
    expr = "(" + intHTML(a) + " + " + intHTML(b) + ") × " + c;
    stepLine = "Trong ngoặc trước: "+intHTML(a)+"+"+intHTML(b)+" = "+intHTML(a+b)+". Rồi nhân "+c+" được "+intHTML((a+b)*c)+".";
  } else if(variant===3){
    const a=randInt(-9,9), b=randInt(2,9), c=randInt(2,9), d=randInt(-9,9);
    ans = F(a - b*c + d);
    expr = intHTML(a) + " − " + b + " × " + c + " + " + intHTML(d);
    stepLine = "Nhân trước "+b+"×"+c+" = "+(b*c)+". Rồi tính trái sang phải: "+intHTML(a)+"−"+(b*c)+"+"+intHTML(d)+" = "+intHTML(a-b*c+d)+".";
  } else {
    const a=randInt(2,12), b=randInt(2,12), c=randInt(-5,5), d=randInt(-5,5);
    ans = F((a-b)*(c+d));
    expr = "(" + a + " − " + b + ") × (" + intHTML(c) + " + " + intHTML(d) + ")";
    stepLine = "Tính trong ngoặc trước: ("+a+"−"+b+") = "+intHTML(a-b)+"; ("+intHTML(c)+"+"+intHTML(d)+") = "+intHTML(c+d)+". Rồi nhân được "+intHTML((a-b)*(c+d))+".";
  }
  const distractors=[];
  distractors.push(F(ans.n + randInt(1,5)));
  distractors.push(F(ans.n - randInt(1,5)));
  distractors.push(ans.neg());
  const mo = makeOptionsFrac(ans, distractors);
  return {
    qHTML: "Tính giá trị: <b>"+expr+"</b> = ?",
    options: mo.options, answerIdx: mo.answerIdx, tag:"Thứ tự phép tính",
    explain: {
      correctHTML: expr+" = <b>"+ans.toLabel()+"</b>",
      steps: ["Nguyên tắc: ngoặc → nhân/chia → cộng/trừ; cùng cấp thì làm trái sang phải.", stepLine],
      realWorld: "Như đi mua hàng: tính (giá × số lượng) trước, rồi mới cộng/trừ vào tổng."
    }
  };
}

// Chặng 6: Biểu diễn thập phân
function genQ_ratDecimal(){
  const variant = pick([1,2]);
  let frac;
  if(variant===1){
    const denoms = [2,4,5,8,10,16,20,25,40,50];
    const d = pick(denoms);
    let n = randInt(1, d-1);
    while(gcd(n,d)===d) n = randInt(1,d-1);
    frac = F(n,d);
  } else {
    const denoms = [3,6,7,9,11,12,15,18,21];
    const d = pick(denoms);
    let n = randInt(1, d-1);
    while(gcd(n,d)===d) n = randInt(1,d-1);
    frac = F(n,d);
  }
  const finite = isFiniteDecimal(frac);
  const correct = finite ? "Số thập phân hữu hạn" : "Số thập phân vô hạn tuần hoàn";
  const wrong = finite ? "Số thập phân vô hạn tuần hoàn" : "Số thập phân hữu hạn";
  const opts = shuffle([correct, wrong, "Số vô tỉ", "Không xác định"]);
  // Mô tả lý do
  let dCheck = frac.d;
  let factors = "";
  let dd = frac.d;
  const primes = [];
  let p = 2;
  while(dd>1){
    while(dd%p===0){primes.push(p); dd/=p}
    p++;
    if(p>dd) {if(dd>1){primes.push(dd); dd=1}}
  }
  factors = primes.join(" × ");
  return {
    qHTML: "Phân số "+frac.toHTML()+" viết được dưới dạng nào?",
    options: opts, answerIdx: opts.indexOf(correct),
    tag:"Biểu diễn thập phân",
    explain: {
      correctHTML: frac.toLabel()+" → <b>"+correct+"</b>",
      steps: [
        "Quy tắc: phân số tối giản chỉ cho thập phân HỮU HẠN nếu mẫu CHỈ CHỨA ước 2 và/hoặc 5.",
        "Mẫu "+frac.d+" = "+factors+" → "+(finite?"chỉ có 2 và 5 → hữu hạn":"có ước khác 2 và 5 → vô hạn tuần hoàn"),
        finite ? "Ví dụ: "+frac.toLabel()+" = "+fmtNum(frac.n/frac.d,4)+"." : "Ví dụ: 1/3 = 0,333... lặp mãi không hết."
      ],
      realWorld: finite
        ? "Như chia "+frac.n+" ổ bánh cho "+frac.d+" bạn: chia đến số chữ số thập phân nào đó là dừng, không lẻ tiếp."
        : "Như chia 1 quả táo cho 3 bạn theo cân điện tử: mãi không ra số chẵn — phần lẻ cứ lặp lại."
    }
  };
}

/* ========================================================================
   PHẦN 6 — SELF-TEST
   ========================================================================*/
function selfTest(){
  console.assert(F(2,4).eq(F(1,2)), "rút gọn");
  console.assert(F(1,2).add(F(1,3)).eq(F(5,6)), "1/2+1/3");
  console.assert(F(-3,4).mul(F(2,5)).eq(F(-3,10)), "(-3/4)*2/5");
  console.assert(F(-1,2).div(F(3,4)).eq(F(-2,3)), "(-1/2)/(3/4)");
  console.assert(F(-2,3).pow(3).eq(F(-8,27)), "(-2/3)^3");
  console.assert(isFiniteDecimal(F(1,2))===true, "1/2 hữu hạn");
  console.assert(isFiniteDecimal(F(1,3))===false, "1/3 vô hạn");
  console.assert(lcm(4,6)===12, "lcm(4,6)");
  // Khẳng định độc lập về tính đúng cho các generator mới
  // 1) divRule: với mỗi câu, đáp số trả về phải thoả mãn rule chia hết
  // 2) primeOrComposite: dùng isPrime để kiểm
  // 3) primeFactorize: nhân lại thừa số phải bằng n
  // 4) gcd/lcm: so với gcd()/lcm() trực tiếp
  // 5) word_*: lưu thêm raw answer & verify trên explain.correctHTML
  const gens = [
    genQ_mulTable, genQ_divTable, genQ_quickAddSub,
    genQ_intArith, genQ_parens, genQ_intOrder,
    genQ_simplifyFrac, genQ_commonDen, genQ_fracBasicPos, genQ_fracDecimal,
    genQ_ratArith, genQ_ratPower, genQ_ratOrder, genQ_ratDecimal,
    // v3:
    genQ_divRule, genQ_primeOrComposite, genQ_primeFactorize,
    genQ_gcd, genQ_lcm,
    genQ_word_arith, genQ_word_fracPct, genQ_word_gcdLcm
  ];
  let pass=0, fail=0;
  for(const g of gens){
    for(let i=0;i<60;i++){
      try{
        const q = g();
        if(!q || !q.options || q.options.length<2) throw new Error("opts");
        if(q.answerIdx<0 || q.answerIdx>=q.options.length) throw new Error("idx");
        if(!q.qHTML) throw new Error("noQ");
        if(!q.explain || !q.explain.steps || !q.explain.realWorld) throw new Error("noExplain");
        const set = new Set(q.options);
        if(set.size !== q.options.length) throw new Error("dup");
        pass++;
      } catch(e){
        fail++;
        if(fail<8) console.warn("test fail", g.name, e.message);
      }
    }
  }
  // ---- Kiểm tra sâu hơn cho generator MỚI ----
  let deep=0, deepFail=0;
  // primeFactorize: nhân thừa số đáp án phải = n trong câu hỏi
  for(let i=0;i<200;i++){
    const q = genQ_primeFactorize();
    // lấy n từ qHTML
    const m = q.qHTML.match(/<b>(\d+)<\/b>/);
    if(!m){ deepFail++; continue; }
    const n = +m[1];
    const ans = q.options[q.answerIdx]; // dạng "__html__2 × 3<sup>2</sup>"
    if(typeof ans!=="string" || !ans.startsWith("__html__")){ deepFail++; continue; }
    const inside = ans.slice("__html__".length);
    // Parse: tách bởi " × " hoặc "×"; mỗi token có thể là "p" hoặc "p<sup>k</sup>"
    const tokens = inside.split(/\s*×\s*/);
    let product = 1; let ok=true;
    for(const t of tokens){
      const mm = t.match(/^(\d+)(?:<sup>(\d+)<\/sup>)?$/);
      if(!mm){ ok=false; break; }
      const p = +mm[1]; const e = mm[2]?+mm[2]:1;
      product *= Math.pow(p,e);
    }
    if(!ok || product!==n) deepFail++;
    deep++;
  }
  // gcd/lcm
  for(let i=0;i<150;i++){
    const q = genQ_gcd();
    const ans = +q.options[q.answerIdx];
    // Lấy 2 hoặc 3 số trong "<b>ƯCLN(a, b[, c])</b>"
    const m = q.qHTML.match(/ƯCLN\(([^)]+)\)/);
    if(!m){ deepFail++; continue; }
    const nums = m[1].split(",").map(s=>+s.trim());
    let g = nums[0]; for(let k=1;k<nums.length;k++) g = gcd(g, nums[k]);
    if(g!==ans) deepFail++;
    deep++;
  }
  for(let i=0;i<150;i++){
    const q = genQ_lcm();
    const ans = +q.options[q.answerIdx];
    const m = q.qHTML.match(/BCNN\(([^)]+)\)/);
    if(!m){ deepFail++; continue; }
    const nums = m[1].split(",").map(s=>+s.trim());
    let L = nums[0]; for(let k=1;k<nums.length;k++) L = lcm(L, nums[k]);
    if(L!==ans) deepFail++;
    deep++;
  }
  // divRule variant 2 ("Có/Không"): tìm số n và divisor d trong qHTML
  for(let i=0;i<150;i++){
    const q = genQ_divRule();
    const ans = q.options[q.answerIdx];
    const tag = q.tag;
    // dạng "Số <b>n</b> có chia hết cho <b>d</b> không?"
    const mYes = q.qHTML.match(/Số <b>(\d+)<\/b> có chia hết cho <b>(\d+)<\/b>/);
    if(mYes){
      const n = +mYes[1], d=+mYes[2];
      const should = (n%d===0) ? "Có" : "Không";
      if(ans !== should) deepFail++;
      deep++;
      continue;
    }
    // dạng "Số nào sau đây chia hết cho <b>d</b>?"
    const mPick = q.qHTML.match(/chia hết cho <b>(\d+)<\/b>/);
    if(mPick){
      const d = +mPick[1];
      const n = +ans;
      if(!Number.isFinite(n) || n%d!==0) deepFail++;
      deep++;
      continue;
    }
    // dạng KHÔNG là ước, hoặc là bội — chỉ kiểm phép đơn giản:
    const mNotDiv = q.qHTML.match(/KHÔNG<\/b> là ước của <b>(\d+)<\/b>/);
    if(mNotDiv){
      const n = +mNotDiv[1]; const a = +ans;
      if(!Number.isFinite(a) || n%a===0) deepFail++;
      deep++;
      continue;
    }
    const mMul = q.qHTML.match(/là <b>bội<\/b> của <b>(\d+)<\/b>/);
    if(mMul){
      const n = +mMul[1]; const a = +ans;
      if(!Number.isFinite(a) || a%n!==0) deepFail++;
      deep++;
      continue;
    }
  }
  // primeOrComposite variant 1: "Số <b>n</b> là số gì?"
  for(let i=0;i<100;i++){
    const q = genQ_primeOrComposite();
    const ans = q.options[q.answerIdx];
    const mPC = q.qHTML.match(/Số <b>(\d+)<\/b> là số gì\?/);
    if(mPC){
      const n = +mPC[1];
      const pr = isPrime(n);
      const should = pr ? "Số nguyên tố" : "Hợp số";
      if(ans!==should) deepFail++;
      deep++;
      continue;
    }
    // variant 2: "số nào là số nguyên tố"
    const mPicker = q.qHTML.match(/là <b>số nguyên tố<\/b>/);
    if(mPicker){
      const n = +ans;
      if(!isPrime(n)) deepFail++;
      deep++;
    }
  }
  // word arith — verify variant 3 (Tổng – hiệu, dễ regex)
  for(let i=0;i<100;i++){
    const q = genQ_word_arith();
    const m = q.qHTML.match(/Lớp 6A có (\d+) bạn, trong đó số bạn nam nhiều hơn số bạn nữ (\d+) bạn.*bạn <b>(nam|nữ)<\/b>/);
    if(m){
      const sum=+m[1], diff=+m[2], who=m[3];
      const should = who==="nam" ? (sum+diff)/2 : (sum-diff)/2;
      const ans = +q.options[q.answerIdx];
      if(ans!==should) deepFail++;
      deep++;
    }
  }
  // word fracPct — verify variant 3 (giảm giá %)
  for(let i=0;i<100;i++){
    const q = genQ_word_fracPct();
    const m = q.qHTML.match(/áo giá <b>([\d.]+)đ<\/b>.*giảm giá (\d+)%/);
    if(m){
      const orig = +m[1].replace(/\./g,"");
      const p = +m[2];
      const should = orig*(100-p)/100;
      const ans = +(q.options[q.answerIdx].replace(/[^\d]/g,""));
      if(ans!==should) deepFail++;
      deep++;
    }
  }
  // word_gcdLcm — verify variant 2 (xe buýt → BCNN)
  for(let i=0;i<100;i++){
    const q = genQ_word_gcdLcm();
    const m = q.qHTML.match(/Xe A cứ <b>(\d+) phút<\/b>.*xe B cứ <b>(\d+) phút<\/b>/);
    if(m){
      const a=+m[1], b=+m[2];
      const should = lcm(a,b);
      const ans = +q.options[q.answerIdx].replace(/\D/g,"");
      if(ans!==should) deepFail++;
      deep++;
    }
  }
  console.log("Self-test base: pass="+pass+", fail="+fail+" | deep checks: "+deep+", deepFail="+deepFail);
  return fail===0 && deepFail===0;
}

const STORAGE_KEYS = { money:"kim_total_money_v3", completed:"kim_completed_v3" };
function loadFromStorage(){
  let money=0, completed=null;
  try{
    const m = localStorage.getItem(STORAGE_KEYS.money);
    if(m!=null){ const n=parseInt(m,10); if(Number.isFinite(n) && n>=0) money = n; }
    const c = localStorage.getItem(STORAGE_KEYS.completed);
    if(c!=null){
      const parsed = JSON.parse(c);
      if(Array.isArray(parsed) && parsed.length===STAGES.length) completed = parsed.map(x=>!!x);
    }
  }catch(e){ /* localStorage không khả dụng — bỏ qua */ }
  return { money, completed: completed || new Array(STAGES.length).fill(false) };
}
function saveMoney(){
  try{ localStorage.setItem(STORAGE_KEYS.money, ""+state.money); }catch(e){}
}
function saveCompleted(){
  try{ localStorage.setItem(STORAGE_KEYS.completed, JSON.stringify(state.completed)); }catch(e){}
}
function resetMoney(){
  state.money = 0; saveMoney();
}

  locked:false,
  money: _persisted.money,
  // pipeline sau khi vượt chặng: cheer → (story?) → (scratch?) → map

  pendingStoryIdx:null,
  pendingScratchPart:null
};

function partOf(i){ return STAGES[i].partIdx; }
function isPartComplete(p){
  for(let i=0;i<STAGES.length;i++) if(STAGES[i].partIdx===p && !state.completed[i]) return false;
  return true;
}
function isUnlocked(i){
  const p = partOf(i);
  if(p===0) return true;
  return isPartComplete(p-1);
}
function partProgress(p){
  let done=0, total=0;
  for(let i=0;i<STAGES.length;i++) if(STAGES[i].partIdx===p){ total++; if(state.completed[i]) done++; }
  return {done,total};
}
function totalDone(){ return state.completed.filter(x=>x).length; }

function fmtVND(n){ return (""+Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+"đ"; }
function pickCheerImage(){

}
function pickCheerText(){ return pick(CHEERS); }
function rollScratch(){
  // 1.000đ ~40%, 2.000đ ~35%, 5.000đ ~20%, 20.000đ ~5%
  const r = Math.random();
  if(r<0.40) return 1000;
  if(r<0.75) return 2000;
  if(r<0.95) return 5000;
  return 20000;
}

const app = document.getElementById("app");
function el(html){

function render(){

  if(state.screen==="title") renderTitle();

  else if(state.screen==="stage") renderStage();
  else if(state.screen==="summary") renderSummary();
  else if(state.screen==="story") renderStory();
  else if(state.screen==="cheer") renderCheer();
  else if(state.screen==="scratch") renderScratch();
  else if(state.screen==="final") renderFinal();
}
