function stageTile(s, idx){
  const done = state.completed[idx];
  const unlocked = isUnlocked(idx);
  const cls = done ? "done" : unlocked ? "unlocked" : "locked";
  const t = el(`
    <div class="stage-tile ${cls} ${s.color}">
      <div class="num">${s.id}</div>
      <div class="ic">${unlocked ? s.icon : "🔒"}</div>
      <p class="name">${s.name}</p>
      <p class="meta">${done?"Đã qua ✓":(unlocked?(s.totalN+" câu · qua "+s.passN+"/"+s.totalN):"Khoá")}</p>
    </div>
  `);
  if(unlocked) t.onclick = ()=>startStage(idx);
  return t;
}

function startStage(i){
  state.stageIdx = i;
  state.questions = STAGES[i].build();
  state.qIdx = 0;
  state.correctCount = 0;
  state.combo = 0;
  state.bestCombo = 0;
  state.score = 0;
  state.locked = false;
  state.screen = "stage";
  render();
}

function renderStage(){
  const s = STAGES[state.stageIdx];
  const q = state.questions[state.qIdx];
  const pct = Math.round((state.qIdx / s.totalN) * 100);
  const v = el(`
    <div>
      <div class="stage-top">
        <span class="mini-av">🧒</span>
        <div class="title">Chặng ${s.id} · ${s.name}</div>
        <div class="meta">
          <span>Câu <b>${state.qIdx+1}</b>/${s.totalN}</span>
          <span>Đúng <b>${state.correctCount}</b></span>
          <span>Điểm <b>${state.score}</b></span>
        </div>
      </div>
      <div class="progress-wrap"><div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div></div>
      <div class="question-card">
        <span class="q-tag">${q.tag}</span>
        <div class="q-text">${q.qHTML}</div>
        <div class="options" id="opts"></div>
        <div class="stage-bottom">
          <span class="combo-badge ${state.combo>=2?"":"zero"}">🔥 Combo ×${state.combo}</span>
          <button class="btn ghost" id="btn-back">← Bản đồ</button>
        </div>
      </div>
    </div>
  `);
  app.appendChild(v);
  const opts = document.getElementById("opts");
  q.options.forEach((label, idx)=>{
    const b = document.createElement("button");
    b.className = "opt-btn";
    b.innerHTML = renderOptionLabel(label);
    b.onclick = ()=>answer(idx);
    opts.appendChild(b);
  });
  document.getElementById("btn-back").onclick = ()=>{
    if(state.locked) return;
    if(confirm("Kim muốn về bản đồ? Tiến trình chặng này sẽ mất.")){
      state.screen = "map"; render();
    }
  };
}

function renderOptionLabel(label){
  if(typeof label === "string" && label.indexOf("__html__")===0) return label.slice("__html__".length);
  if(/[a-zA-ZÀ-ỹ]/.test(label)) return label;
  if(label.indexOf("/")>=0){
    let neg=false, body=label;
    if(body[0]==="−"||body[0]==="-"){neg=true; body=body.slice(1)}
    const [n,d] = body.split("/");
    return (neg?"−":"") + '<span class="frac"><span class="num">'+n+'</span><span class="den">'+d+'</span></span>';
  }
  if(label[0]==="-") return "−"+label.slice(1);
  return label;
}

function answer(idx){
  if(state.locked) return;
  state.locked = true;
  const q = state.questions[state.qIdx];
  const optsEl = document.getElementById("opts");
  Array.from(optsEl.children).forEach((btn, i)=>{
    btn.disabled = true;
    if(i === q.answerIdx) btn.classList.add("correct");
    else if(i === idx) btn.classList.add("wrong");
    else btn.classList.add("dim");
  });
  const correct = idx === q.answerIdx;
  if(correct){
    state.correctCount++;
    state.combo++;
    if(state.combo > state.bestCombo) state.bestCombo = state.combo;
    const bonus = Math.max(0, state.combo-1)*3;
    state.score += 10 + bonus;
    // Nhỏ flash, không cần modal
    setTimeout(()=>{
      state.locked = false;
      state.qIdx++;
      if(state.qIdx >= STAGES[state.stageIdx].totalN) finishStage();
      else render();
    }, 800);
  } else {
    state.combo = 0;
    // BẮT đọc giải thích
    showExplainModal(q, idx);
  }
}

function showExplainModal(q, chosenIdx){
  const correctLabel = q.options[q.answerIdx];
  const chosenLabel = q.options[chosenIdx];
  const exp = q.explain || {};
  const stepsHTML = (exp.steps||[]).map(s=>"<div>• "+s+"</div>").join("");
  const modal = el(`
    <div class="modal-backdrop" id="exp-bd">
      <div class="modal explain-modal">
        <div class="explain-head">
          <div class="av">🧒</div>
          <div class="h">
            <div class="t">Chưa đúng, không sao Kim ơi 💪</div>
            <div class="s">Đọc giải thích nhé, rồi chúng ta đi tiếp.</div>
          </div>
        </div>

        <div class="ex-block">
          <div class="label">🎯 Đáp án đúng</div>
          <div class="content">${exp.correctHTML || ("Đúng là <b>"+renderOptionLabel(correctLabel)+"</b>")}.
          <br><span style="color:var(--ink-2);font-size:13px">(Kim chọn: <b>${renderOptionLabel(chosenLabel)}</b> — chưa đúng.)</span></div>
        </div>

        <div class="ex-block steps">
          <div class="label">📝 Cách làm từng bước</div>
          <div class="content">${stepsHTML || "<div>• Làm theo công thức của dạng bài này.</div>"}</div>
        </div>

        <div class="ex-block real">
          <div class="label">💡 Ví dụ đời thường</div>
          <div class="content">${exp.realWorld || "Cứ bình tĩnh, làm lại sẽ ra."}</div>
        </div>

        <div class="ex-actions">
          <button class="btn mint" id="btn-understood">Đã hiểu — đi tiếp 👍</button>
        </div>
      </div>
    </div>
  `);
  app.appendChild(modal);
  document.getElementById("btn-understood").onclick = ()=>{
    modal.remove();
    state.locked = false;
    state.qIdx++;
    if(state.qIdx >= STAGES[state.stageIdx].totalN) finishStage();
    else render();
  };
}

function finishStage(){
  const s = STAGES[state.stageIdx];
  const pass = state.correctCount >= s.passN;
  const wasCompleted = state.completed[state.stageIdx];
  // Kiểm tra phần đã hoàn tất trước chặng này hay chưa
  const partWasComplete = isPartComplete(s.partIdx);
  state._justFirstStagePass = pass && !wasCompleted;
  state._justCompletedPart  = pass && !wasCompleted && !partWasComplete && (()=>{
    state.completed[s.stageIdx] = true;
    const ok = isPartComplete(s.partIdx);
    state.completed[s.stageIdx] = wasCompleted; // revert tạm; finishStage sẽ set lại bên dưới
    return ok;
  })();
  if(pass){
    state.completed[state.stageIdx] = true;
    saveCompleted();
    fireConfetti();
  }
  state.screen = "summary";
  render();
}

function buildPostFlow(){
  // Thẻ động viên random — luôn có sau mỗi chặng nhỏ.
  // Câu chuyện lịch sử — chỉ ở chặng có storyIdx (6 chặng).
  // Thẻ cào — CHỈ ở lần ĐẦU hoàn tất phần (tránh chơi lại để spam tiền).
  const stage = STAGES[state.stageIdx];
  state.postFlow = ["cheer"];
  if(stage.storyIdx!==null){
    state.pendingStoryIdx = stage.storyIdx;
    state.postFlow.push("story");
  } else {
    state.pendingStoryIdx = null;
  }
  if(state._justCompletedPart){
    state.pendingScratchPart = stage.partIdx;
    state.postFlow.push("scratch");
  } else {
    state.pendingScratchPart = null;
  }
}
function advancePostFlow(){
  const next = state.postFlow.shift();
  if(!next){ state.screen="map"; render(); return; }
  state.screen = next;
  render();
}

function renderSummary(){
  const s = STAGES[state.stageIdx];
  const pass = state.correctCount >= s.passN;
  const stars = pass ? (state.correctCount===s.totalN ? "★★★" : state.correctCount>=9 ? "★★☆" : "★☆☆") : "☆☆☆";
  const endsPart = pass && state._justCompletedPart;
  const hasStory = pass && s.storyIdx!==null;
  let nextLabel;
  if(!pass) nextLabel = null;
  else {
    const parts = [];
    parts.push("🎉 Thẻ động viên");
    if(hasStory) parts.push("📜 Câu chuyện lịch sử");
    if(endsPart) parts.push("💰 Thẻ cào");
    nextLabel = parts.join(" + ");
  }
  const v = el(`
    <div>
      <div class="map-header">
        <h2>${pass ? "🎉 Kim vượt chặng "+s.id+"!" : "💪 Kim thử lại chặng "+s.id+" nhé!"}</h2>
      </div>
      <div class="summary-card">
        <div class="summary-stars">${stars}</div>
        <div class="summary-stat">Đúng: <b>${state.correctCount}/${s.totalN}</b> · Combo cao nhất: <b>×${state.bestCombo}</b></div>
        <div class="summary-stat">Điểm chặng: <b>${state.score}</b></div>
        <div class="summary-stat" style="margin-top:12px">
          ${pass ? "Kim đã vượt chặng <b>"+s.name+"</b>. Mở phần thưởng tiếp theo nào!" : "Cần đúng ít nhất <b>"+s.passN+"/"+s.totalN+"</b>. Chơi lại nhé — đề sẽ đổi mới hoàn toàn."}
        </div>
        <div class="summary-actions">
          ${pass ? `<button class="btn pink" id="btn-story">${nextLabel} →</button>` : '<button class="btn" id="btn-retry">↻ Thử lại</button>'}
          <button class="btn ghost" id="btn-map">← Về bản đồ</button>
        </div>
      </div>
    </div>
  `);
  app.appendChild(v);
  if(pass){
    document.getElementById("btn-story").onclick = ()=>{
      buildPostFlow();
      advancePostFlow();
    };
  } else {
    document.getElementById("btn-retry").onclick = ()=>startStage(state.stageIdx);
  }
  document.getElementById("btn-map").onclick = ()=>{state.screen="map"; render()};
}

function renderStory(){
  renderMap();

    <div class="modal-backdrop">

        <div class="story-head">

function renderScratch(){
  // Bản đồ làm nền
  renderMap();
  const p = state.pendingScratchPart;
  const part = PARTS[p];
  const prize = rollScratch();
  const isBig = prize===20000;

  const modal = el(`
    <div class="modal-backdrop">
      <div class="modal scratch-modal">
        <div style="text-align:center;margin-bottom:6px">
          <div style="font-size:13px;font-weight:800;color:var(--ink-2);letter-spacing:0.6px;text-transform:uppercase">💰 Thẻ cào · Hoàn tất ${part.title.split("—")[0].trim()}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">Cào thẻ để xem Kim trúng bao nhiêu (tiền thưởng trong game)</div>
        </div>
        <p class="scratch-hint">Dùng ngón tay / chuột miết lên thẻ để cào — hoặc bấm nút "Cào ngay".</p>
        <div class="scratch-stage" id="sc-stage">
          <div class="scratch-prize ${isBig?"big":""}">
            <div class="amount">${fmtVND(prize)}</div>
            <div class="label">Tiền thưởng game</div>
            ${isBig?'<div class="lucky">🎊 MAY MẮN LỚN! 🎊</div>':''}
          </div>
          <canvas class="scratch-canvas" id="sc-canvas"></canvas>
        </div>
        <div id="sc-result" style="display:none">
          <div class="total-money-line">
            🎁 Kim vừa cào trúng <b>${fmtVND(prize)}</b>!<br>
            <span style="font-size:13px;font-weight:600;color:#155e75">Tổng số tiền Kim đã tích luỹ: <b id="sc-total"></b></span>
          </div>
          <div class="money-note">(Đây là tiền thưởng trong game để Kim phấn đấu — không phải tiền thật trong app.)</div>
        </div>
        <div style="margin-top:12px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap" id="sc-actions">
          <button class="btn sun" id="btn-scratch-now">🪙 Cào ngay</button>
          <button class="btn mint" id="btn-scratch-next" style="display:none">Tiếp tục →</button>
        </div>
      </div>
    </div>
  `);
  app.appendChild(modal);

  const stage = document.getElementById("sc-stage");
  const canvas = document.getElementById("sc-canvas");
  const ctx = canvas.getContext("2d");
  let cleared = false;
  function paintCover(){
    const rect = stage.getBoundingClientRect();
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    canvas.width = w; canvas.height = h;
    const grad = ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0,"#c0c0c0");
    grad.addColorStop(0.5,"#e8e8e8");
    grad.addColorStop(1,"#9ca3af");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle = "rgba(31,42,68,0.7)";
    ctx.font = "bold 18px -apple-system,sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("🪙 Cào nhẹ vào đây để xem", w/2, h/2 - 6);
    ctx.font = "13px -apple-system,sans-serif";
    ctx.fillText("Kim trúng bao nhiêu nhé!", w/2, h/2 + 14);
  }
  setTimeout(paintCover, 0);

  function pointer(e){
    const rect = canvas.getBoundingClientRect();
    let cx, cy;
    if(e.touches && e.touches[0]){ cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else { cx = e.clientX; cy = e.clientY; }
    return { x:(cx-rect.left)*(canvas.width/rect.width), y:(cy-rect.top)*(canvas.height/rect.height) };
  }
  let drawing = false;
  function startDraw(e){ drawing = true; scratchAt(e); }
  function moveDraw(e){ if(drawing){ e.preventDefault(); scratchAt(e); } }
  function endDraw(){ drawing = false; checkClear(); }
  function scratchAt(e){
    if(cleared) return;
    const p = pointer(e);
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 28, 0, Math.PI*2);
    ctx.fill();
  }
  function checkClear(){
    if(cleared) return;
    // mẫu nhanh: đếm pixel đã xóa
    const w = canvas.width, h = canvas.height;
    const sample = 24;
    const data = ctx.getImageData(0,0,w,h).data;
    let empty=0, total=0;
    for(let y=0;y<h;y+=sample){
      for(let x=0;x<w;x+=sample){
        const idx = (y*w + x)*4 + 3;
        if(data[idx]<10) empty++;
        total++;
      }
    }
    if(total>0 && empty/total > 0.45) revealPrize();
  }
  function revealPrize(){
    if(cleared) return;
    cleared = true;
    canvas.classList.add("cleared");
    state.money += prize;
    saveMoney();
    document.getElementById("sc-total").textContent = fmtVND(state.money);
    document.getElementById("sc-result").style.display = "block";
    document.getElementById("btn-scratch-now").style.display = "none";
    document.getElementById("btn-scratch-next").style.display = "inline-flex";
    if(isBig){ firePopPaper(); }
  }

  canvas.addEventListener("mousedown", startDraw);
  canvas.addEventListener("mousemove", moveDraw);
  window.addEventListener("mouseup", endDraw);
  canvas.addEventListener("touchstart", startDraw, {passive:false});
  canvas.addEventListener("touchmove",  moveDraw,  {passive:false});
  canvas.addEventListener("touchend",   endDraw);

  document.getElementById("btn-scratch-now").onclick = ()=>{ revealPrize(); };
  document.getElementById("btn-scratch-next").onclick = ()=>{ advancePostFlow(); };
}

          ⚙️ 4 phép tính số hữu tỉ · ⚡ Lũy thừa & thứ tự · 🔢 Biểu diễn thập phân<br><br>
          <span style="color:#0e7490;font-weight:700">💰 Heo đất của Kim đang có: ${fmtVND(state.money)}</span><br>
          <span style="color:var(--mint-2);font-weight:700">Kim đã vững nền tảng để bước vào Chương II Số thực — chuyện đó để bản sau nhé.</span>
        </div>
        <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn pink" id="btn-replay">↻ Chơi lại từ đầu</button>
          <button class="btn ghost" id="btn-map">← Bản đồ</button>
        </div>
      </div>
    </div>
  `);
  app.appendChild(v);
  document.getElementById("btn-replay").onclick = ()=>{
    state.completed = new Array(STAGES.length).fill(false);
    saveCompleted();
    state.screen = "map"; render();
  };
  document.getElementById("btn-map").onclick = ()=>{state.screen="map"; render()};
}

/* ====== Confetti nhỏ ====== */
function fireConfetti(){
  const colors = ["#3b82f6","#ec4899","#10b981","#f59e0b","#8b5cf6","#fb7185"];
  const layer = document.createElement("div");
  layer.className = "confetti";
  for(let i=0;i<60;i++){
    const c = document.createElement("i");
    c.style.left = (Math.random()*100)+"%";
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay = (Math.random()*0.6)+"s";
    c.style.animationDuration = (1.8 + Math.random()*1.5)+"s";
    c.style.transform = "rotate("+Math.floor(Math.random()*360)+"deg)";
    layer.appendChild(c);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 3200);
}
/* ====== Pop paper (thẻ cào giải lớn) ====== */
function firePopPaper(){
  const colors = ["#fbbf24","#fb7185","#a78bfa","#34d399","#60a5fa","#f472b6","#ffffff"];
  const layer = document.createElement("div");
  layer.className = "pop-paper";
  for(let i=0;i<90;i++){
    const c = document.createElement("i");
    c.style.left = (Math.random()*100)+"%";
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay = (Math.random()*0.4)+"s";
    c.style.animationDuration = (1.8 + Math.random()*1.6)+"s";
    c.style.transform = "rotate("+Math.floor(Math.random()*360)+"deg)";
    layer.appendChild(c);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 3200);
}
