function finishStage(){
  const s = STAGES[state.stageIdx];
  const pass = state.correctCount >= s.passN;
  const wasCompleted = state.completed[state.stageIdx];
  state._justFirstStagePass = pass && !wasCompleted;
  // v3.2: Trao thẻ cào MỖI lần vượt chặng cuối của một phần (chặng 3, 6, 9, 12),
  // kể cả khi phần đó đã từng hoàn tất trước đó. Bỏ điều kiện chống-spam cũ
  // (trước đây chỉ trao lần đầu hoàn tất phần) để khuyến khích học lại.
  state._justCompletedPart  = pass && isPartClosingStage(state.stageIdx);
  if(pass){
    state.completed[state.stageIdx] = true;
    saveCompleted();
    fireConfetti();
  }
  state.screen = "summary";
  render();
}

function buildPostFlow(){
  // Thẻ động viên random — luôn có sau mỗi chặng nhỏ.
  // Câu chuyện lịch sử — chỉ ở chặng có storyIdx (6 chặng).
  // Thẻ cào — MỖI lần vượt chặng cuối của phần (kể cả khi học lại phần đó).
  const stage = STAGES[state.stageIdx];
  state.postFlow = ["cheer"];
  if(stage.storyIdx!==null){
    state.pendingStoryIdx = stage.storyIdx;
    state.postFlow.push("story");
  } else {
    state.pendingStoryIdx = null;
  }
  if(state._justCompletedPart){
    state.pendingScratchPart = stage.partIdx;
    state.postFlow.push("scratch");
  } else {
    state.pendingScratchPart = null;
  }
}
function advancePostFlow(){
  const next = state.postFlow.shift();
  if(!next){ state.screen="map"; render(); return; }
  state.screen = next;
  render();
}

function renderSummary(){
  const s = STAGES[state.stageIdx];

function renderScratch(){
  // Bản đồ làm nền
  renderMap();
  const p = state.pendingScratchPart;
  const part = PARTS[p];
  const prize = rollScratch();
  const isBig = prize===20000;

  const modal = el(`
    <div class="modal-backdrop">
      <div class="modal scratch-modal">
        <div style="text-align:center;margin-bottom:6px">
          <div style="font-size:13px;font-weight:800;color:var(--ink-2);letter-spacing:0.6px;text-transform:uppercase">💰 Thẻ cào · Hoàn tất ${part.title.split("—")[0].trim()}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">Cào thẻ để xem Kim trúng bao nhiêu (tiền thưởng trong game)</div>
        </div>
        <p class="scratch-hint">Dùng ngón tay / chuột miết lên thẻ để cào — hoặc bấm nút "Cào ngay".</p>
        <div class="scratch-stage" id="sc-stage">
          <div class="scratch-prize ${isBig?"big":""}">
            <div class="amount">${fmtVND(prize)}</div>
            <div class="label">Tiền thưởng game</div>
            ${isBig?'<div class="lucky">🎊 MAY MẮN LỚN! 🎊</div>':''}
          </div>
          <canvas class="scratch-canvas" id="sc-canvas"></canvas>
        </div>
        <div id="sc-result" style="display:none">
          <div class="total-money-line">
            🎁 Kim vừa cào trúng <b>${fmtVND(prize)}</b>!<br>
            <span style="font-size:13px;font-weight:600;color:#155e75">Tổng số tiền Kim đã tích luỹ: <b id="sc-total"></b></span>
          </div>
          <div class="money-note">(Đây là tiền thưởng trong game để Kim phấn đấu — không phải tiền thật trong app.)</div>
        </div>
        <div style="margin-top:12px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap" id="sc-actions">
          <button class="btn sun" id="btn-scratch-now">🪙 Cào ngay</button>
          <button class="btn mint" id="btn-scratch-next" style="display:none">Tiếp tục →</button>
        </div>
      </div>
    </div>
  `);
  app.appendChild(modal);

  const stage = document.getElementById("sc-stage");
  const canvas = document.getElementById("sc-canvas");
  const ctx = canvas.getContext("2d");
  let cleared = false;
  function paintCover(){
    const rect = stage.getBoundingClientRect();
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    canvas.width = w; canvas.height = h;
    const grad = ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0,"#c0c0c0");
    grad.addColorStop(0.5,"#e8e8e8");
    grad.addColorStop(1,"#9ca3af");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle = "rgba(31,42,68,0.7)";
    ctx.font = "bold 18px -apple-system,sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("🪙 Cào nhẹ vào đây để xem", w/2, h/2 - 6);
    ctx.font = "13px -apple-system,sans-serif";
    ctx.fillText("Kim trúng bao nhiêu nhé!", w/2, h/2 + 14);
  }
  setTimeout(paintCover, 0);

  function pointer(e){
    const rect = canvas.getBoundingClientRect();
    let cx, cy;
    if(e.touches && e.touches[0]){ cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else { cx = e.clientX; cy = e.clientY; }
    return { x:(cx-rect.left)*(canvas.width/rect.width), y:(cy-rect.top)*(canvas.height/rect.height) };
  }
  let drawing = false;
  function startDraw(e){ drawing = true; scratchAt(e); }
  function moveDraw(e){ if(drawing){ e.preventDefault(); scratchAt(e); } }
  function endDraw(){ drawing = false; checkClear(); }
  function scratchAt(e){
    if(cleared) return;
    const p = pointer(e);
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 28, 0, Math.PI*2);
    ctx.fill();
  }
  function checkClear(){
    if(cleared) return;
    // mẫu nhanh: đếm pixel đã xóa
    const w = canvas.width, h = canvas.height;
    const sample = 24;
    const data = ctx.getImageData(0,0,w,h).data;
    let empty=0, total=0;
    for(let y=0;y<h;y+=sample){
      for(let x=0;x<w;x+=sample){
        const idx = (y*w + x)*4 + 3;
        if(data[idx]<10) empty++;
        total++;
      }
    }
    if(total>0 && empty/total > 0.45) revealPrize();
  }
  function revealPrize(){
    if(cleared) return;
    cleared = true;
    canvas.classList.add("cleared");
    state.money += prize;
    saveMoney();
    document.getElementById("sc-total").textContent = fmtVND(state.money);
    document.getElementById("sc-result").style.display = "block";
    document.getElementById("btn-scratch-now").style.display = "none";
    document.getElementById("btn-scratch-next").style.display = "inline-flex";
    if(isBig){ firePopPaper(); }
  }

  canvas.addEventListener("mousedown", startDraw);
  canvas.addEventListener("mousemove", moveDraw);
  window.addEventListener("mouseup", endDraw);
  canvas.addEventListener("touchstart", startDraw, {passive:false});
  canvas.addEventListener("touchmove",  moveDraw,  {passive:false});
  canvas.addEventListener("touchend",   endDraw);

  document.getElementById("btn-scratch-now").onclick = ()=>{ revealPrize(); };
  document.getElementById("btn-scratch-next").onclick = ()=>{ advancePostFlow(); };
}

        </div>
      </div>
    </div>
  `);
  app.appendChild(v);
  document.getElementById("btn-replay").onclick = ()=>{
    state.completed = new Array(STAGES.length).fill(false);
    saveCompleted();
    state.screen = "map"; render();
  };
  document.getElementById("btn-map").onclick = ()=>{state.screen="map"; render()};
}

/* ====== Confetti nhỏ ====== */
function fireConfetti(){
  const colors = ["#3b82f6","#ec4899","#10b981","#f59e0b","#8b5cf6","#fb7185"];
  const layer = document.createElement("div");
  layer.className = "confetti";
  for(let i=0;i<60;i++){
    const c = document.createElement("i");
    c.style.left = (Math.random()*100)+"%";
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay = (Math.random()*0.6)+"s";
    c.style.animationDuration = (1.8 + Math.random()*1.5)+"s";
    c.style.transform = "rotate("+Math.floor(Math.random()*360)+"deg)";
    layer.appendChild(c);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 3200);
}
/* ====== Pop paper (thẻ cào giải lớn) ====== */
function firePopPaper(){
  const colors = ["#fbbf24","#fb7185","#a78bfa","#34d399","#60a5fa","#f472b6","#ffffff"];
  const layer = document.createElement("div");
  layer.className = "pop-paper";
  for(let i=0;i<90;i++){
    const c = document.createElement("i");
    c.style.left = (Math.random()*100)+"%";
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay = (Math.random()*0.4)+"s";
    c.style.animationDuration = (1.8 + Math.random()*1.6)+"s";
    c.style.transform = "rotate("+Math.floor(Math.random()*360)+"deg)";
    layer.appendChild(c);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 3200);
}
